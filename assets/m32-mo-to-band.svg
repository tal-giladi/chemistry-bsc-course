<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>From molecular orbitals to a band</title>
  <desc>Energy levels of a Hückel chain of N identical atoms with one electron each, for N = 1, 2, 3, 4, 8 and 20, and the continuous band for very large N. Each added atom adds one level; the levels spread over a width that approaches 4 times the coupling beta, and get closer together until they form a continuous band. Filled levels are blue and empty ones grey; with one electron per atom the band is half full, up to the Fermi level in the middle, which makes the chain a metal.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <line x1="40" y1="35.0" x2="40" y2="285.0" stroke="#333"/>
  <text x="34" y="39.0" text-anchor="end">α − 2β</text>
  <text x="34" y="164.0" text-anchor="end">α</text>
  <text x="34" y="289.0" text-anchor="end">α + 2β</text>
  <text x="320" y="20" text-anchor="middle" font-weight="bold">more atoms, more levels, same width: a band (blue = filled)</text>
  <line x1="60" y1="160.0" x2="110" y2="160.0" stroke="#1f5fa8" stroke-width="2"/><text x="85" y="305" text-anchor="middle">N = 1</text><line x1="145" y1="222.5" x2="195" y2="222.5" stroke="#1f5fa8" stroke-width="2"/><line x1="145" y1="97.5" x2="195" y2="97.5" stroke="#999999" stroke-width="2"/><text x="170" y="305" text-anchor="middle">N = 2</text><line x1="230" y1="248.4" x2="280" y2="248.4" stroke="#1f5fa8" stroke-width="2"/><line x1="230" y1="160.0" x2="280" y2="160.0" stroke="#1f5fa8" stroke-width="2"/><line x1="230" y1="71.6" x2="280" y2="71.6" stroke="#999999" stroke-width="2"/><text x="255" y="305" text-anchor="middle">N = 3</text><line x1="315" y1="261.1" x2="365" y2="261.1" stroke="#1f5fa8" stroke-width="2"/><line x1="315" y1="198.6" x2="365" y2="198.6" stroke="#1f5fa8" stroke-width="2"/><line x1="315" y1="121.4" x2="365" y2="121.4" stroke="#999999" stroke-width="2"/><line x1="315" y1="58.9" x2="365" y2="58.9" stroke="#999999" stroke-width="2"/><text x="340" y="305" text-anchor="middle">N = 4</text><line x1="400" y1="277.5" x2="450" y2="277.5" stroke="#1f5fa8" stroke-width="2"/><line x1="400" y1="255.8" x2="450" y2="255.8" stroke="#1f5fa8" stroke-width="2"/><line x1="400" y1="222.5" x2="450" y2="222.5" stroke="#1f5fa8" stroke-width="2"/><line x1="400" y1="181.7" x2="450" y2="181.7" stroke="#1f5fa8" stroke-width="2"/><line x1="400" y1="138.3" x2="450" y2="138.3" stroke="#999999" stroke-width="2"/><line x1="400" y1="97.5" x2="450" y2="97.5" stroke="#999999" stroke-width="2"/><line x1="400" y1="64.2" x2="450" y2="64.2" stroke="#999999" stroke-width="2"/><line x1="400" y1="42.5" x2="450" y2="42.5" stroke="#999999" stroke-width="2"/><text x="425" y="305" text-anchor="middle">N = 8</text><line x1="485" y1="283.6" x2="535" y2="283.6" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="279.4" x2="535" y2="279.4" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="272.6" x2="535" y2="272.6" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="263.3" x2="535" y2="263.3" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="251.6" x2="535" y2="251.6" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="237.9" x2="535" y2="237.9" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="222.5" x2="535" y2="222.5" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="205.7" x2="535" y2="205.7" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="187.8" x2="535" y2="187.8" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="169.3" x2="535" y2="169.3" stroke="#1f5fa8" stroke-width="2"/><line x1="485" y1="150.7" x2="535" y2="150.7" stroke="#999999" stroke-width="2"/><line x1="485" y1="132.2" x2="535" y2="132.2" stroke="#999999" stroke-width="2"/><line x1="485" y1="114.3" x2="535" y2="114.3" stroke="#999999" stroke-width="2"/><line x1="485" y1="97.5" x2="535" y2="97.5" stroke="#999999" stroke-width="2"/><line x1="485" y1="82.1" x2="535" y2="82.1" stroke="#999999" stroke-width="2"/><line x1="485" y1="68.4" x2="535" y2="68.4" stroke="#999999" stroke-width="2"/><line x1="485" y1="56.7" x2="535" y2="56.7" stroke="#999999" stroke-width="2"/><line x1="485" y1="47.4" x2="535" y2="47.4" stroke="#999999" stroke-width="2"/><line x1="485" y1="40.6" x2="535" y2="40.6" stroke="#999999" stroke-width="2"/><line x1="485" y1="36.4" x2="535" y2="36.4" stroke="#999999" stroke-width="2"/><text x="510" y="305" text-anchor="middle">N = 20</text><rect x="570" y="35.0" width="50" height="125.0" fill="#bbbbbb"/><rect x="570" y="160.0" width="50" height="125.0" fill="#1f5fa8"/><text x="595" y="305" text-anchor="middle">N → ∞</text><text x="626" y="164.0" font-size="11">E_F</text>
</svg>
