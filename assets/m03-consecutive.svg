<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Consecutive reactions A to B to C</title>
  <desc id="desc">Concentrations of A, B and C against time for k1 = 0.15 per minute and k2 = 0.05 per minute, starting from 10 mM of A. A decays exponentially, B rises to a maximum of 5.8 mM at 11 minutes and then falls, C starts flat with an S-shaped rise towards 10 mM.</desc>
