    <text x="137" y="256" text-anchor="middle">10</text>
    <text x="213" y="256" text-anchor="middle">20</text>
    <text x="290" y="256" text-anchor="middle">30</text>
    <text x="367" y="256" text-anchor="middle">40</text>
    <text x="443" y="256" text-anchor="middle">50</text>
    <text x="520" y="256" text-anchor="middle">60</text>
    <text x="52" y="244" text-anchor="end">0</text>
    <text x="52" y="200" text-anchor="end">2</text>
    <text x="52" y="156" text-anchor="end">4</text>
    <text x="52" y="112" text-anchor="end">6</text>
    <text x="52" y="68" text-anchor="end">8</text>
    <text x="52" y="24" text-anchor="end">10</text>
    <text x="290" y="276" text-anchor="middle">time (min)</text>
    <text x="16" y="130" text-anchor="middle" transform="rotate(-90 16 130)">concentration (mM)</text>
    <text x="106" y="145" fill="#1f5fa8" font-weight="bold">A</text>
    <text x="150" y="105" fill="#c0392b" font-weight="bold">B (max 5.8 mM at 11 min)</text>
    <text x="443" y="39" fill="#1e8449" font-weight="bold">C</text>
  </g>
