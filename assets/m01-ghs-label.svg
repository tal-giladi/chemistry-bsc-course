<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Parts of a GHS label</title>
  <desc id="d">A schematic chemical label with six numbered parts: product identifier, pictogram, signal word, hazard statements, precautionary statements and supplier details.</desc>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <rect x="20" y="20" width="400" height="340" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="40" y="58" font-size="22" font-weight="bold" fill="#111">EXAMPLE CLEANER 5%</text>
  <text x="40" y="80" font-size="13" fill="#444">contains: example substance (CAS 0000-00-0)</text>
  <g transform="translate(95,150)">
    <rect x="-38" y="-38" width="76" height="76" transform="rotate(45)" fill="#fff" stroke="#d00" stroke-width="7"/>
    <text x="0" y="17" font-size="50" font-weight="bold" text-anchor="middle" fill="#111">!</text>
  </g>
  <text x="180" y="138" font-size="26" font-weight="bold" fill="#111">WARNING</text>
  <text x="180" y="165" font-size="13" fill="#111">H315 Causes skin irritation.</text>
  <text x="180" y="183" font-size="13" fill="#111">H319 Causes serious eye irritation.</text>
  <text x="40" y="240" font-size="13" fill="#111">P102 Keep out of reach of children.</text>
  <text x="40" y="258" font-size="13" fill="#111">P280 Wear eye protection.</text>
  <text x="40" y="276" font-size="13" fill="#111">P305+P351+P338 IF IN EYES: Rinse cautiously with water...</text>
  <text x="40" y="330" font-size="12" fill="#444">Example Ltd., 1 Example St., Haifa · tel 00-000-0000</text>
  <g font-size="14" fill="#0b4f9c" font-weight="bold">
    <line x1="420" y1="55" x2="455" y2="55" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="60">1 Product identifier</text>
    <line x1="140" y1="150" x2="150" y2="110" stroke="#0b4f9c" stroke-width="1.5"/><line x1="150" y1="110" x2="455" y2="110" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="115">2 Pictogram</text>
    <line x1="330" y1="130" x2="455" y2="150" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="155">3 Signal word</text>
    <line x1="400" y1="178" x2="455" y2="195" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="200">4 Hazard (H) statements</text>
    <line x1="410" y1="258" x2="455" y2="258" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="250">5 Precautionary</text><text x="482" y="268">(P) statements</text>
    <line x1="400" y1="326" x2="455" y2="326" stroke="#0b4f9c" stroke-width="1.5"/><text x="462" y="331">6 Supplier details</text>
  </g>
</svg>
