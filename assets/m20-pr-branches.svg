<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>P and R branches of a diatomic vibration-rotation band</title>
  <desc>Top: rotational levels J = 0 to 4 of the vibrational levels v = 0 and v = 1. R-branch arrows (blue) go from J to J + 1, P-branch arrows (red) from J to J - 1; there is no arrow with J unchanged. Bottom: the resulting HCl spectrum, P lines below and R lines above the band centre at 2886 per centimetre, with a gap at the centre where the forbidden Q branch would be.</desc>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <line x1="60" y1="310.0" x2="700" y2="310.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="314.0">J = 0</text>
  <line x1="60" y1="300.0" x2="700" y2="300.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="304.0">J = 1</text>
  <line x1="60" y1="280.0" x2="700" y2="280.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="284.0">J = 2</text>
  <line x1="60" y1="250.0" x2="700" y2="250.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="254.0">J = 3</text>
  <line x1="60" y1="210.0" x2="700" y2="210.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="214.0">J = 4</text>
  <text x="10" y="314" font-weight="bold">v = 0</text>
  <line x1="60" y1="165.0" x2="700" y2="165.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="169.0">J = 0</text>
  <line x1="60" y1="155.0" x2="700" y2="155.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="159.0">J = 1</text>
  <line x1="60" y1="135.0" x2="700" y2="135.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="139.0">J = 2</text>
  <line x1="60" y1="105.0" x2="700" y2="105.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="109.0">J = 3</text>
  <line x1="60" y1="65.0" x2="700" y2="65.0" stroke="#374151" stroke-width="1.2"/>
  <text x="706" y="69.0">J = 4</text>
  <text x="10" y="169" font-weight="bold">v = 1</text>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker></defs>
  <line x1="120" y1="310.0" x2="120" y2="161.0" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="120" y="330" text-anchor="middle" fill="#1d4ed8">R(0)</text>
  <line x1="190" y1="300.0" x2="190" y2="141.0" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="190" y="330" text-anchor="middle" fill="#1d4ed8">R(1)</text>
  <line x1="260" y1="280.0" x2="260" y2="111.0" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="260" y="330" text-anchor="middle" fill="#1d4ed8">R(2)</text>
  <line x1="420" y1="300.0" x2="420" y2="171.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="420" y="330" text-anchor="middle" fill="#b91c1c">P(1)</text>
  <line x1="490" y1="280.0" x2="490" y2="161.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="490" y="330" text-anchor="middle" fill="#b91c1c">P(2)</text>
  <line x1="560" y1="250.0" x2="560" y2="141.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="560" y="330" text-anchor="middle" fill="#b91c1c">P(3)</text>
