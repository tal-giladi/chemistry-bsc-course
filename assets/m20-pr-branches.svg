  <line x1="113.6" y1="470" x2="113.6" y2="455.2" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="406.4" y1="470" x2="406.4" y2="424.8" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="444.6" y1="470" x2="444.6" y2="408.4" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="483.8" y1="470" x2="483.8" y2="406.3" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="524.1" y1="470" x2="524.1" y2="415.3" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="565.3" y1="470" x2="565.3" y2="429.6" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="607.5" y1="470" x2="607.5" y2="443.9" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="650.7" y1="470" x2="650.7" y2="455.2" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="694.9" y1="470" x2="694.9" y2="462.5" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="77.8" y="488" text-anchor="middle" font-size="11">3050</text>
  <text x="166.7" y="488" text-anchor="middle" font-size="11">3000</text>
  <text x="255.6" y="488" text-anchor="middle" font-size="11">2950</text>
  <text x="344.4" y="488" text-anchor="middle" font-size="11">2900</text>
  <text x="433.3" y="488" text-anchor="middle" font-size="11">2850</text>
