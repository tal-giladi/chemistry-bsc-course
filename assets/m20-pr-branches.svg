  <text x="369.3" y="395" text-anchor="middle" font-size="12">gap: no Q branch (2886)</text>
  <text x="184.4" y="395" text-anchor="middle" fill="#1d4ed8" font-weight="bold">R branch</text>
  <text x="557.8" y="395" text-anchor="middle" fill="#b91c1c" font-weight="bold">P branch</text>
  <text x="380.0" y="498" text-anchor="middle" font-size="11">wavenumber / cm⁻¹ (HCl, decreasing to the right)</text>
</svg>
