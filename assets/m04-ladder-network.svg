<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Resistor ladder network for lesson 04.4</title>
  <desc>A battery of voltage Vs feeds R1 to node A. From node A, R2 goes to the battery minus and R3 goes to node B. From node B, R4 goes to the battery minus. Voltages VA and VB are measured from each node to the battery minus.</desc>
  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="2" fill="none">
    <!-- battery on the left, vertical -->
    <line x1="60" y1="40" x2="60" y2="105"/>
    <line x1="40" y1="105" x2="80" y2="105"/>
    <line x1="50" y1="117" x2="70" y2="117" stroke-width="4"/>
    <line x1="60" y1="117" x2="60" y2="220"/>
    <!-- top wire to R1 -->
    <line x1="60" y1="40" x2="130" y2="40"/>
    <rect x="130" y="28" width="70" height="24" fill="#f4f4f4"/>
    <line x1="200" y1="40" x2="250" y2="40"/>
    <!-- node A to R3 -->
    <line x1="250" y1="40" x2="300" y2="40"/>
    <rect x="300" y="28" width="70" height="24" fill="#f4f4f4"/>
    <line x1="370" y1="40" x2="430" y2="40"/>
    <!-- R2 down from A -->
    <line x1="250" y1="40" x2="250" y2="95"/>
    <rect x="238" y="95" width="24" height="70" fill="#f4f4f4"/>
    <line x1="250" y1="165" x2="250" y2="220"/>
    <!-- R4 down from B -->
    <line x1="430" y1="40" x2="430" y2="95"/>
    <rect x="418" y="95" width="24" height="70" fill="#f4f4f4"/>
    <line x1="430" y1="165" x2="430" y2="220"/>
    <!-- bottom wire -->
    <line x1="60" y1="220" x2="430" y2="220"/>
  </g>
  <g fill="#222222">
    <circle cx="250" cy="40" r="5"/>
    <circle cx="430" cy="40" r="5"/>
    <circle cx="250" cy="220" r="4"/>
    <text x="150" y="20">R1 220 Ω</text>
    <text x="318" y="20">R3 330 Ω</text>
    <text x="270" y="135">R2 470 Ω</text>
    <text x="450" y="135">R4 1 kΩ</text>
    <text x="244" y="68" font-weight="bold" text-anchor="end">A</text>
    <text x="445" y="68" font-weight="bold">B</text>
    <text x="88" y="100">+</text>
    <text x="88" y="130">−</text>
    <text x="10" y="160">Vs</text>
    <text x="10" y="178">2 × AA</text>
    <text x="150" y="245">battery minus = 0 V (black probe here)</text>
  </g>
</svg>
