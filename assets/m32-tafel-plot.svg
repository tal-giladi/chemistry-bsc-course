  <line x1="367.1" y1="250" x2="367.1" y2="25" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="330" y="300" text-anchor="middle">overpotential η / V</text>
  <text x="22" y="140" text-anchor="middle" transform="rotate(-90 22 140)">log₁₀ |i| / A cm⁻²</text>
  <text x="70.0" y="268" text-anchor="middle">-0.4</text><text x="218.6" y="268" text-anchor="middle">-0.2</text><text x="367.1" y="268" text-anchor="middle">+0.0</text><text x="515.7" y="268" text-anchor="middle">+0.2</text>
