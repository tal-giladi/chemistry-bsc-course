<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Tafel plot of a Butler-Volmer electrode</title>
  <desc>Log of the absolute current density against overpotential for i0 = 1e-5 A/cm2 and alpha = 0.5. Near zero overpotential the curve dips (net current goes to zero). Far from equilibrium both branches become straight lines with slopes of 118 mV per decade; dashed extrapolations of the two lines meet at log i0 at zero overpotential. At large negative overpotential the cathodic current levels off at the mass-transport limit.</desc>
