  <title>O2 saturation curves of myoglobin and haemoglobin</title>
  <desc>Saturation in percent against oxygen partial pressure from 0 to 120 mmHg. Myoglobin (P50 2.39 mmHg, Hill coefficient 1) rises steeply and is above 89 percent at 20 mmHg. Haemoglobin (standard human blood curve, 37 C, pH 7.40) is sigmoid with P50 near 27 mmHg. A shaded band from 20 to 100 mmHg marks the range between working muscle and the lungs.</desc>
