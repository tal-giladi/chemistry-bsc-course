<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">The vibrations of CO2</title>
  <desc id="d">Three rows show the normal modes of linear O=C=O. Top: symmetric stretch at 1333 per cm, both oxygen atoms move outward while carbon stays still; no dipole change, Raman active only. Middle: bend at 667 per cm, doubly degenerate, both oxygens move up while carbon moves down; IR active. Bottom: antisymmetric stretch at 2349 per cm, carbon moves right while both oxygens move left; IR active.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222">
    <!-- row 1: symmetric stretch -->
    <line x1="90" y1="60" x2="250" y2="60" stroke="#555555" stroke-width="5"/>
    <circle cx="90" cy="60" r="20" fill="#d9534f"/><circle cx="170" cy="60" r="16" fill="#666666"/><circle cx="250" cy="60" r="20" fill="#d9534f"/>
    <text x="84" y="65" fill="#ffffff">O</text><text x="165" y="65" fill="#ffffff">C</text><text x="244" y="65" fill="#ffffff">O</text>
    <line x1="64" y1="60" x2="30" y2="60" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <line x1="276" y1="60" x2="310" y2="60" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <text x="340" y="52">ν1 symmetric stretch, 1333 cm⁻¹</text>
    <text x="340" y="74" fill="#555555">C still, no dipole change: Raman only</text>
    <!-- row 2: bend -->
    <line x1="90" y1="180" x2="250" y2="180" stroke="#555555" stroke-width="5"/>
    <circle cx="90" cy="180" r="20" fill="#d9534f"/><circle cx="170" cy="180" r="16" fill="#666666"/><circle cx="250" cy="180" r="20" fill="#d9534f"/>
    <text x="84" y="185" fill="#ffffff">O</text><text x="165" y="185" fill="#ffffff">C</text><text x="244" y="185" fill="#ffffff">O</text>
    <line x1="90" y1="156" x2="90" y2="140" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <line x1="250" y1="156" x2="250" y2="140" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <line x1="170" y1="200" x2="170" y2="242" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <text x="340" y="172">ν2 bend, 667 cm⁻¹ (two, degenerate)</text>
    <text x="340" y="194" fill="#555555">dipole swings sideways: IR active</text>
    <!-- row 3: antisymmetric stretch -->
    <line x1="90" y1="300" x2="250" y2="300" stroke="#555555" stroke-width="5"/>
    <circle cx="90" cy="300" r="20" fill="#d9534f"/><circle cx="170" cy="300" r="16" fill="#666666"/><circle cx="250" cy="300" r="20" fill="#d9534f"/>
    <text x="84" y="305" fill="#ffffff">O</text><text x="165" y="305" fill="#ffffff">C</text><text x="244" y="305" fill="#ffffff">O</text>
    <line x1="72" y1="276" x2="56" y2="276" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <line x1="268" y1="276" x2="252" y2="276" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <line x1="150" y1="332" x2="196" y2="332" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
    <text x="340" y="292">ν3 antisymmetric stretch, 2349 cm⁻¹</text>
    <text x="340" y="314" fill="#555555">C moves against both O: IR active</text>
  </g>
</svg>
