<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="Helvetica, Arial, sans-serif">
  <title>Oxidation ladder of one carbon atom</title>
  <desc>Five boxes from left to right: methane at oxidation level minus 4, methanol minus 2, formaldehyde 0, formic acid plus 2, carbon dioxide plus 4. Arrows between them point right and are labelled oxidation; a lower arrow points left and is labelled reduction. Below each box the matching functional-group class is named: alkane, alcohol, aldehyde or ketone, carboxylic acid and derivatives, carbon dioxide.</desc>
  <rect width="760" height="230" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker>
  </defs>
  <g font-size="15" text-anchor="middle" fill="#111111">
    <rect x="15" y="40" width="110" height="60" rx="8" fill="#e8f0fb" stroke="#2b5c9e"/>
    <text x="70" y="66">CH₄</text><text x="70" y="88" font-size="13">level −4</text>
    <rect x="165" y="40" width="110" height="60" rx="8" fill="#e8f0fb" stroke="#2b5c9e"/>
    <text x="220" y="66">CH₃OH</text><text x="220" y="88" font-size="13">level −2</text>
    <rect x="315" y="40" width="110" height="60" rx="8" fill="#e8f0fb" stroke="#2b5c9e"/>
    <text x="370" y="66">H₂C=O</text><text x="370" y="88" font-size="13">level 0</text>
    <rect x="465" y="40" width="110" height="60" rx="8" fill="#e8f0fb" stroke="#2b5c9e"/>
    <text x="520" y="66">HCOOH</text><text x="520" y="88" font-size="13">level +2</text>
    <rect x="615" y="40" width="130" height="60" rx="8" fill="#e8f0fb" stroke="#2b5c9e"/>
    <text x="680" y="66">O=C=O</text><text x="680" y="88" font-size="13">level +4</text>
    <g font-size="12" fill="#444444">
      <text x="70" y="122">alkane</text>
      <text x="220" y="122">alcohol, ether,</text><text x="220" y="137">alkyl halide, amine</text>
      <text x="370" y="122">aldehyde, ketone,</text><text x="370" y="137">acetal, imine</text>
      <text x="520" y="122">carboxylic acid,</text><text x="520" y="137">ester, amide, nitrile</text>
      <text x="680" y="122">CO₂, carbonate,</text><text x="680" y="137">urea</text>
    </g>
  </g>
  <g stroke="#333333" stroke-width="1.6" fill="none">
    <line x1="128" y1="55" x2="162" y2="55" marker-end="url(#ar)"/>
    <line x1="278" y1="55" x2="312" y2="55" marker-end="url(#ar)"/>
    <line x1="428" y1="55" x2="462" y2="55" marker-end="url(#ar)"/>
    <line x1="578" y1="55" x2="612" y2="55" marker-end="url(#ar)"/>
    <line x1="700" y1="175" x2="60" y2="175" marker-end="url(#ar)"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333333">
    <text x="380" y="25">oxidation: replace a C–H bond by a bond to O, N or halogen (+2 per step)</text>
    <text x="380" y="200">reduction: the reverse (H₂, NaBH₄, LiAlH₄)</text>
  </g>
</svg>
