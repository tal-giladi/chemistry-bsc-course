<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="sans-serif" font-size="13">
  <title>Secant and tangent on a decay curve</title>
  <desc>A concentration curve falling with time. A tangent line touches the curve at t = 150 s; its slope is the instantaneous rate. A secant line joins the points at 120 s and 180 s; its slope is the average rate and is close to the tangent slope.</desc>
  <rect width="480" height="300" fill="#ffffff"/>
  <line x1="60" y1="250" x2="450" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="272" text-anchor="end">t (s)</text>
  <text x="20" y="40" transform="rotate(-90 20 40)" text-anchor="end">c (mol/L)</text>
  <path d="M60.0,50.0 L76.2,69.0 L92.5,86.3 L108.8,101.8 L125.0,115.9 L141.2,128.7 L157.5,140.2 L173.8,150.7 L190.0,160.1 L206.2,168.7 L222.5,176.4 L238.8,183.4 L255.0,189.8 L271.2,195.5 L287.5,200.7 L303.8,205.4 L320.0,209.6 L336.2,213.5 L352.5,216.9 L368.8,220.1 L385.0,222.9 L401.2,225.5 L417.5,227.8 L433.8,229.9 L450.0,231.9" fill="none" stroke="#1f6fb2" stroke-width="2.5"/>
  <line x1="97.5" y1="99.7" x2="257.5" y2="207.7" stroke="#c0392b" stroke-width="2"/>
  <circle cx="157.5" cy="140.2" r="4" fill="#c0392b"/>
  <line x1="108" y1="105.9" x2="207" y2="172.9" stroke="#27ae60" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="138" cy="126.2" r="3.5" fill="#27ae60"/>
  <circle cx="177" cy="152.6" r="3.5" fill="#27ae60"/>
  <text x="200" y="238" fill="#c0392b">tangent at 150 s: slope = dc/dt</text>
  <text x="215" y="110" fill="#27ae60">secant 120 to 180 s: average rate</text>
  <text x="380" y="214" fill="#1f6fb2">c(t)</text>
</svg>
