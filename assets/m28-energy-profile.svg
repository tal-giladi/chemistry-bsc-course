<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Energy profile of a two-step reaction</title>
  <desc>Gibbs energy against reaction coordinate for a two-step reaction: reactants, a first transition state, an intermediate in a shallow well, a second lower transition state, and products below the reactants. The first barrier is the larger one, so the first step is rate-determining.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <line x1="60" y1="320" x2="610" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="320" x2="60" y2="20" stroke="#333" stroke-width="1.5"/>
  <polygon points="610,320 600,315 600,325" fill="#333"/>
  <polygon points="60,20 55,30 65,30" fill="#333"/>
  <text x="335" y="348" text-anchor="middle">reaction coordinate</text>
  <text x="25" y="170" text-anchor="middle" transform="rotate(-90 25 170)">Gibbs energy</text>
  <path d="M 80 220 C 120 220, 140 220, 170 170 S 210 70, 230 70 S 270 130, 300 160 S 330 175, 340 175 S 370 170, 390 140 S 420 115, 430 115 S 470 160, 500 230 S 560 260, 600 260" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="80" y1="220" x2="250" y2="220" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="320" y1="175" x2="450" y2="175" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="200" y1="70" x2="260" y2="70" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="400" y1="115" x2="460" y2="115" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="250" y1="218" x2="250" y2="74" stroke="#b03030" stroke-width="1.5"/>
  <polygon points="250,72 246,82 254,82" fill="#b03030"/>
  <text x="256" y="150" fill="#b03030">ΔG‡₁</text>
  <line x1="450" y1="173" x2="450" y2="119" stroke="#b03030" stroke-width="1.5"/>
  <polygon points="450,117 446,127 454,127" fill="#b03030"/>
  <text x="456" y="152" fill="#b03030">ΔG‡₂</text>
  <text x="80" y="210">reactants</text>
  <text x="230" y="60" text-anchor="middle">TS1 (saddle)</text>
  <text x="340" y="195" text-anchor="middle">intermediate</text>
  <text x="340" y="210" text-anchor="middle">(shallow minimum)</text>
  <text x="430" y="105" text-anchor="middle">TS2</text>
  <text x="600" y="282" text-anchor="end">products</text>
  <line x1="560" y1="220" x2="600" y2="220" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="580" y1="222" x2="580" y2="256" stroke="#2a7a2a" stroke-width="1.5"/>
  <polygon points="580,258 576,248 584,248" fill="#2a7a2a"/>
  <text x="586" y="244" fill="#2a7a2a">ΔG°</text>
</svg>
