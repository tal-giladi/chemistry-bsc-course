<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Lineweaver-Burk patterns of reversible inhibition</title>
<desc>Three panels of 1/v against 1/[S] with no inhibitor (blue) and two inhibitor concentrations (orange, red). Competitive: lines meet on the 1/v axis. Uncompetitive: parallel lines. Mixed: lines meet left of the 1/v axis, above the 1/[S] axis.</desc>
<rect width="780" height="300" fill="white"/>
<clipPath id="c0"><rect x="20" y="40" width="230" height="200"/></clipPath>
<rect x="20" y="40" width="230" height="200" fill="none" stroke="#999"/>
<line x1="20.0" x2="250.0" y1="230.5" y2="230.5" stroke="black"/>
<line x1="96.7" x2="96.7" y1="40" y2="240" stroke="black"/>
<line x1="20.0" y1="240.0" x2="250.0" y2="154.3" stroke="#1f5fa8" stroke-width="2.2" clip-path="url(#c0)"/>
<line x1="20.0" y1="268.6" x2="250.0" y2="97.1" stroke="#d07a00" stroke-width="2.2" clip-path="url(#c0)"/>
<line x1="20.0" y1="297.1" x2="250.0" y2="40.0" stroke="#c0392b" stroke-width="2.2" clip-path="url(#c0)"/>
<text x="135.0" y="26" text-anchor="middle" font-weight="bold">competitive</text>
<text x="246" y="246.5" text-anchor="end">1/[S]</text>
<text x="101.7" y="54">1/v</text>
<clipPath id="c1"><rect x="275" y="40" width="230" height="200"/></clipPath>
<rect x="275" y="40" width="230" height="200" fill="none" stroke="#999"/>
<line x1="275.0" x2="505.0" y1="230.5" y2="230.5" stroke="black"/>
<line x1="351.7" x2="351.7" y1="40" y2="240" stroke="black"/>
<line x1="275.0" y1="240.0" x2="505.0" y2="154.3" stroke="#1f5fa8" stroke-width="2.2" clip-path="url(#c1)"/>
<line x1="275.0" y1="221.0" x2="505.0" y2="135.2" stroke="#d07a00" stroke-width="2.2" clip-path="url(#c1)"/>
<line x1="275.0" y1="201.9" x2="505.0" y2="116.2" stroke="#c0392b" stroke-width="2.2" clip-path="url(#c1)"/>
<text x="390.0" y="26" text-anchor="middle" font-weight="bold">uncompetitive</text>
<text x="501" y="246.5" text-anchor="end">1/[S]</text>
<text x="356.7" y="54">1/v</text>
<clipPath id="c2"><rect x="530" y="40" width="230" height="200"/></clipPath>
<rect x="530" y="40" width="230" height="200" fill="none" stroke="#999"/>
<line x1="530.0" x2="760.0" y1="230.5" y2="230.5" stroke="black"/>
<line x1="606.7" x2="606.7" y1="40" y2="240" stroke="black"/>
<line x1="530.0" y1="240.0" x2="760.0" y2="154.3" stroke="#1f5fa8" stroke-width="2.2" clip-path="url(#c2)"/>
<line x1="530.0" y1="262.2" x2="760.0" y2="90.8" stroke="#d07a00" stroke-width="2.2" clip-path="url(#c2)"/>
<line x1="530.0" y1="284.4" x2="760.0" y2="27.3" stroke="#c0392b" stroke-width="2.2" clip-path="url(#c2)"/>
<text x="645.0" y="26" text-anchor="middle" font-weight="bold">mixed</text>
<text x="756" y="246.5" text-anchor="end">1/[S]</text>
<text x="611.7" y="54">1/v</text>
<text x="20" y="275">Blue: no inhibitor; orange, red: more inhibitor. Competitive: same intercept 1/Vmax.</text>
<text x="20" y="293">Uncompetitive: same slope Km/Vmax. Mixed: lines cross left of the 1/v axis.</text>
</svg>
