<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Franck-Condon principle for the B-X transition of I2</title>
  <desc>Morse potential curves of I2 built from NIST constants. The ground state X has its minimum at 2.67 angstrom; the excited B state has its minimum at 3.02 angstrom about 15 800 per centimetre higher. A vertical arrow from the v double-prime = 0 level at 2.67 angstrom reaches the B curve near 19 300 per centimetre, around v prime = 30, far above the B-state minimum. The dashed line marks the dissociation limit of the B state.</desc>
