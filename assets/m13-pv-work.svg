<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Compression work on a p-V diagram</title>
  <desc>Pressure against volume for compressing an ideal gas at constant temperature from V1 to V2. The reversible path follows the curved isotherm and the work done on the gas is the area under it. The one-step path pushes against the final pressure p2 the whole way, so its work is the larger rectangle.</desc>
  <rect width="520" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="310" x2="490" y2="310" stroke="#222" stroke-width="1.5"/>
  <line x1="70" y1="310" x2="70" y2="30" stroke="#222" stroke-width="1.5"/>
  <text x="480" y="335" text-anchor="end">volume V</text>
  <text x="30" y="40" transform="rotate(-90 30 40)" text-anchor="end">pressure p</text>
  <!-- one-step rectangle: from V1=430 to V2=200 at p2 (y=90) -->
  <rect x="200" y="90" width="230" height="220" fill="#f4a261" fill-opacity="0.35" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- reversible area under isotherm p = k/V; V1=430 -> y=200 (p1), V2=200 -> y=90 (p2) -->
  <path d="M200,90 C260,128 330,168 430,200 L430,310 L200,310 Z" fill="#2a9d8f" fill-opacity="0.45" stroke="none"/>
  <path d="M200,90 C260,128 330,168 430,200" fill="none" stroke="#1d3557" stroke-width="2.5"/>
  <!-- points -->
  <circle cx="430" cy="200" r="5" fill="#1d3557"/>
  <circle cx="200" cy="90" r="5" fill="#1d3557"/>
  <text x="438" y="196">1 (V1, p1)</text>
  <text x="120" y="84">2 (V2, p2)</text>
  <!-- ticks -->
  <line x1="200" y1="310" x2="200" y2="316" stroke="#222"/>
  <line x1="430" y1="310" x2="430" y2="316" stroke="#222"/>
  <text x="200" y="330" text-anchor="middle">V2</text>
  <text x="430" y="330" text-anchor="middle">V1</text>
  <line x1="64" y1="90" x2="70" y2="90" stroke="#222"/>
  <line x1="64" y1="200" x2="70" y2="200" stroke="#222"/>
  <text x="58" y="94" text-anchor="end">p2</text>
  <text x="58" y="204" text-anchor="end">p1</text>
  <!-- labels -->
  <text x="300" y="262" text-anchor="middle" fill="#0b3d36">reversible: w = nRT ln(V1/V2)</text>
  <text x="300" y="280" text-anchor="middle" fill="#0b3d36">(area under the isotherm)</text>
  <text x="315" y="112" text-anchor="middle" fill="#9c3d22">one step against p2: w = p2 (V1 − V2)</text>
  <text x="315" y="128" text-anchor="middle" fill="#9c3d22">(whole rectangle, more work)</text>
</svg>
