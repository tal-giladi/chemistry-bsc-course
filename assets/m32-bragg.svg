<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Bragg reflection from two lattice planes</title>
  <desc>Two parallel rows of atoms, a distance d apart. Two X-ray beams arrive at angle theta to the planes and leave at the same angle. The beam reflected from the lower plane travels an extra distance d sin theta on the way in and d sin theta on the way out, 2 d sin theta in total. The reflections add up when this extra path is a whole number of wavelengths, n lambda = 2 d sin theta.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <line x1="40" y1="150" x2="600" y2="150" stroke="#bbb"/>
  <line x1="40" y1="230" x2="600" y2="230" stroke="#bbb"/>
  <line x1="40" y1="310" x2="600" y2="310" stroke="#bbb"/>
  <circle cx="80" cy="150" r="7" fill="#1f5fa8"/><circle cx="160" cy="150" r="7" fill="#1f5fa8"/><circle cx="240" cy="150" r="7" fill="#1f5fa8"/><circle cx="320" cy="150" r="7" fill="#1f5fa8"/><circle cx="400" cy="150" r="7" fill="#1f5fa8"/><circle cx="480" cy="150" r="7" fill="#1f5fa8"/><circle cx="560" cy="150" r="7" fill="#1f5fa8"/><circle cx="80" cy="230" r="7" fill="#1f5fa8"/><circle cx="160" cy="230" r="7" fill="#1f5fa8"/><circle cx="240" cy="230" r="7" fill="#1f5fa8"/><circle cx="320" cy="230" r="7" fill="#1f5fa8"/><circle cx="400" cy="230" r="7" fill="#1f5fa8"/><circle cx="480" cy="230" r="7" fill="#1f5fa8"/><circle cx="560" cy="230" r="7" fill="#1f5fa8"/><circle cx="80" cy="310" r="7" fill="#1f5fa8"/><circle cx="160" cy="310" r="7" fill="#1f5fa8"/><circle cx="240" cy="310" r="7" fill="#1f5fa8"/><circle cx="320" cy="310" r="7" fill="#1f5fa8"/><circle cx="400" cy="310" r="7" fill="#1f5fa8"/><circle cx="480" cy="310" r="7" fill="#1f5fa8"/><circle cx="560" cy="310" r="7" fill="#1f5fa8"/>
  <polyline points="111.5,52.8 320,150 528.5,52.8" fill="none" stroke="#b03030" stroke-width="2.5"/>
  <polyline points="111.5,132.8 320,230 528.5,132.8" fill="none" stroke="#b03030" stroke-width="2.5"/>
  <line x1="320" y1="150" x2="289.4" y2="215.7" stroke="#333" stroke-dasharray="4 3"/>
  <line x1="320" y1="150" x2="350.6" y2="215.7" stroke="#333" stroke-dasharray="4 3"/>
  <line x1="289.4" y1="215.7" x2="320" y2="230" stroke="#2a8a3a" stroke-width="4"/>
  <line x1="320" y1="230" x2="350.6" y2="215.7" stroke="#2a8a3a" stroke-width="4"/>
  <text x="380" y="216" fill="#2a8a3a">d sin θ</text>
  <text x="208" y="216" fill="#2a8a3a">d sin θ</text>
  <line x1="610" y1="150" x2="610" y2="230" stroke="#333"/>
  <text x="618" y="194.0">d</text>
  <path d="M 260 150 A 60 60 0 0 1 265.6 124.6" fill="none" stroke="#333"/>
  <text x="232" y="142">θ</text>
  <text x="121.5" y="48.8">incoming X-rays, wavelength λ</text>
  <text x="518.5" y="48.8" text-anchor="end">reflected beams</text>
  <text x="320" y="16" text-anchor="middle" font-weight="bold">extra path = 2 d sin θ = n λ  (Bragg's law)</text>
</svg>
