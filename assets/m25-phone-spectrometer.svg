<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Cardboard and DVD phone spectrometer, seen from above</title>
  <desc>Light from a lamp passes through the sample cup, then through a narrow slit at the far end of a closed cardboard box about 20 cm long. At the near end a small clear piece of DVD-R taped over the phone camera acts as a transmission grating; the phone is tilted about 50 degrees to the box axis so the camera sees the first-order rainbow.</desc>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <!-- lamp -->
  <circle cx="45" cy="150" r="24" fill="#fff6c8" stroke="#333" stroke-width="2"/>
  <text x="15" y="200">lamp</text>
  <text x="5" y="218" font-size="12">(white LED or CFL)</text>
  <!-- cup -->
  <rect x="100" y="115" width="50" height="70" rx="6" fill="#cfe3ff" stroke="#333" stroke-width="2"/>
  <text x="92" y="205">sample cup</text>
  <!-- light ray -->
  <line x1="70" y1="150" x2="200" y2="150" stroke="#e0a000" stroke-width="3"/>
  <!-- box -->
  <rect x="200" y="95" width="400" height="110" fill="#f1e4cf" stroke="#7a5a2e" stroke-width="3"/>
  <text x="330" y="88">closed cardboard box, black inside (about 20 cm)</text>
  <!-- slit -->
  <rect x="195" y="95" width="10" height="48" fill="#222"/>
  <rect x="195" y="157" width="10" height="48" fill="#222"/>
  <text x="150" y="250">slit: two card edges</text>
  <text x="150" y="267">about 0.3 to 0.5 mm apart</text>
  <line x1="200" y1="240" x2="200" y2="160" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- inner beam -->
  <line x1="205" y1="150" x2="590" y2="150" stroke="#e0a000" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- grating and phone -->
  <line x1="600" y1="125" x2="600" y2="175" stroke="#5b6cff" stroke-width="5"/>
  <text x="520" y="240">clear DVD-R piece</text>
  <text x="520" y="257">(0.74 um tracks, 1350 per mm)</text>
  <line x1="605" y1="225" x2="600" y2="178" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <g transform="rotate(-50 640 150)">
    <rect x="615" y="95" width="50" height="110" rx="8" fill="#444" stroke="#111" stroke-width="2"/>
    <circle cx="640" cy="115" r="7" fill="#99ccff"/>
  </g>
  <text x="560" y="30">phone tilted about 50 degrees</text>
  <text x="560" y="47">camera looks at the first order</text>
  <!-- diffracted orders -->
  <line x1="600" y1="150" x2="690" y2="95" stroke="#3050ff" stroke-width="2"/>
  <line x1="600" y1="150" x2="680" y2="80" stroke="#20a040" stroke-width="2"/>
  <line x1="600" y1="150" x2="662" y2="66" stroke="#e02020" stroke-width="2"/>
  <text x="20" y="310" font-size="13">grating equation: d sin(theta) = m lambda; d = 0.74 um, so 550 nm leaves at about 48 degrees</text>
</svg>
