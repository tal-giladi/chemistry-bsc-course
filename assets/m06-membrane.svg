<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Lipid bilayer and what crosses it</title>
  <desc>A lipid bilayer drawn as two rows of phospholipids, polar heads facing the water on both sides and fatty tails in the middle. Arrows show that O2 and CO2 cross the bilayer directly, water crosses slowly and quickly through an aquaporin channel, glucose needs a carrier protein, and ions such as K+ need an ion channel.</desc>
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="14" font-weight="bold">Outside (water, polar)</text>
  <text x="20" y="325" font-size="14" font-weight="bold">Inside the cell (water, polar)</text>
  <!-- heads and tails: top leaflet -->
  <g id="lipids" stroke="#8a6d3b" stroke-width="2">
    <g id="row">
      <line x1="30" y1="122" x2="30" y2="168"/><line x1="36" y1="122" x2="36" y2="168"/>
      <line x1="60" y1="122" x2="60" y2="168"/><line x1="66" y1="122" x2="66" y2="168"/>
      <line x1="90" y1="122" x2="90" y2="168"/><line x1="96" y1="122" x2="96" y2="168"/>
      <line x1="120" y1="122" x2="120" y2="168"/><line x1="126" y1="122" x2="126" y2="168"/>
      <line x1="150" y1="122" x2="150" y2="168"/><line x1="156" y1="122" x2="156" y2="168"/>
      <line x1="180" y1="122" x2="180" y2="168"/><line x1="186" y1="122" x2="186" y2="168"/>
      <line x1="210" y1="122" x2="210" y2="168"/><line x1="216" y1="122" x2="216" y2="168"/>
      <line x1="240" y1="122" x2="240" y2="168"/><line x1="246" y1="122" x2="246" y2="168"/>
      <line x1="270" y1="122" x2="270" y2="168"/><line x1="276" y1="122" x2="276" y2="168"/>
      <line x1="300" y1="122" x2="300" y2="168"/><line x1="306" y1="122" x2="306" y2="168"/>
      <line x1="330" y1="122" x2="330" y2="168"/><line x1="336" y1="122" x2="336" y2="168"/>
      <line x1="360" y1="122" x2="360" y2="168"/><line x1="366" y1="122" x2="366" y2="168"/>
    </g>
    <use href="#row" transform="translate(0,60)"/>
    <use href="#row" transform="translate(360,0)"/>
    <use href="#row" transform="translate(360,60)"/>
  </g>
  <g fill="#3a7bd5">
    <circle cx="33" cy="114" r="9"/><circle cx="63" cy="114" r="9"/><circle cx="93" cy="114" r="9"/><circle cx="123" cy="114" r="9"/><circle cx="153" cy="114" r="9"/><circle cx="183" cy="114" r="9"/><circle cx="213" cy="114" r="9"/><circle cx="243" cy="114" r="9"/><circle cx="273" cy="114" r="9"/><circle cx="303" cy="114" r="9"/><circle cx="333" cy="114" r="9"/><circle cx="363" cy="114" r="9"/>
    <circle cx="393" cy="114" r="9"/><circle cx="423" cy="114" r="9"/><circle cx="453" cy="114" r="9"/><circle cx="483" cy="114" r="9"/><circle cx="513" cy="114" r="9"/><circle cx="543" cy="114" r="9"/><circle cx="573" cy="114" r="9"/><circle cx="603" cy="114" r="9"/><circle cx="633" cy="114" r="9"/><circle cx="663" cy="114" r="9"/><circle cx="693" cy="114" r="9"/><circle cx="723" cy="114" r="9"/>
    <circle cx="33" cy="236" r="9"/><circle cx="63" cy="236" r="9"/><circle cx="93" cy="236" r="9"/><circle cx="123" cy="236" r="9"/><circle cx="153" cy="236" r="9"/><circle cx="183" cy="236" r="9"/><circle cx="213" cy="236" r="9"/><circle cx="243" cy="236" r="9"/><circle cx="273" cy="236" r="9"/><circle cx="303" cy="236" r="9"/><circle cx="333" cy="236" r="9"/><circle cx="363" cy="236" r="9"/>
    <circle cx="393" cy="236" r="9"/><circle cx="423" cy="236" r="9"/><circle cx="453" cy="236" r="9"/><circle cx="483" cy="236" r="9"/><circle cx="513" cy="236" r="9"/><circle cx="543" cy="236" r="9"/><circle cx="573" cy="236" r="9"/><circle cx="603" cy="236" r="9"/><circle cx="633" cy="236" r="9"/><circle cx="663" cy="236" r="9"/><circle cx="693" cy="236" r="9"/><circle cx="723" cy="236" r="9"/>
  </g>
  <!-- proteins -->
  <rect x="438" y="96" width="40" height="160" rx="10" fill="#9bc59d" stroke="#3c763d" stroke-width="2"/>
  <rect x="548" y="96" width="40" height="160" rx="10" fill="#e6b0aa" stroke="#a94442" stroke-width="2"/>
  <rect x="648" y="96" width="44" height="160" rx="10" fill="#d7c4e8" stroke="#6a4c93" stroke-width="2"/>
  <!-- labels for layers -->
  <text x="60" y="80" fill="#3a7bd5">polar heads</text>
  <text x="60" y="180" fill="#8a6d3b">nonpolar tails, about 3 nm</text>
  <!-- arrows -->
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="230" y1="55" x2="230" y2="290"/>
    <line x1="350" y1="55" x2="350" y2="290" stroke-dasharray="6 5"/>
    <line x1="458" y1="55" x2="458" y2="290"/>
    <line x1="568" y1="55" x2="568" y2="290"/>
    <line x1="670" y1="55" x2="670" y2="290"/>
  </g>
  <g font-size="12">
    <text x="196" y="50">O2, CO2</text>
    <text x="196" y="305">fast, direct</text>
    <text x="320" y="50">water</text>
    <text x="300" y="305">slow, direct</text>
    <text x="420" y="50">water</text>
    <text x="414" y="305">aquaporin</text>
    <text x="540" y="50">glucose</text>
    <text x="520" y="305">carrier protein</text>
    <text x="650" y="50">K+, Na+</text>
    <text x="630" y="305">ion channel</text>
  </g>
</svg>
