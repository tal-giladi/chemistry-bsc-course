<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-taught Chemistry Degree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="The Technion B.Sc. in Chemistry, course by course, as a hands-on self-study path with simulated labs, real data and safe home experiments.">
  <link rel="stylesheet" href="vendor/vue.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="preview/preview.css?v=3">
</head>
<body>
  <div id="app">Loading…</div>
  <script src="preview/preview.js?v=4"></script>
  <script>
    window.$docsify = {
      name: 'Chemistry B.Sc. (self-taught)',
      repo: 'tal-giladi/chemistry-bsc-course',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      alias: { '/.*/_sidebar.md': '/preview/_sidebar.md' },
      search: { placeholder: 'Search the course…', noData: 'No results.', depth: 3 },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
      plugins: [window.CoursePreviewPlugin]
    };
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/docsify-copy-code.min.js"></script>
  <script src="vendor/prism/prism-python.min.js"></script>
  <script src="vendor/prism/prism-yaml.min.js"></script>
  <script src="vendor/prism/prism-bash.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
</body>
</html>
