- id: q1
  question: >-
    A chemist proposes replacing the zinc of carbonic anhydrase with copper(II), since Cu2+ binds the
    three histidines more strongly. What is the main objection?
  options:
    - Copper cannot bind water, so no hydroxide nucleophile would form at the site.
    - Copper is too large for the site and would fall out at once.
    - Copper is redox-active, so the site would no longer be a clean Lewis acid.
    - Copper lowers the pKa of water too little to make any hydroxide at pH 7.
  correct: 2
  explanation: >-
    Stronger binding is not the goal. Zn2+ is d10, redox-inert and flexible in coordination, so it can
    hold a reactive hydroxide without starting radical chemistry; Cu2+ can be reduced and oxidised.
- id: q2
  question: >-
    Two electron-transfer reactions in the same protein have lambda = 0.8 eV and the same distance. One
    has a driving force of 0.8 eV, the other 1.8 eV. Which is faster?
  options:
    - The 1.8 eV reaction, because more driving force always lowers the barrier.
    - The 0.8 eV reaction, as the rate peaks when driving force equals lambda.
    - Both equally, because tunnelling rates depend only on distance.
    - Neither can occur, because driving forces above lambda forbid any transfer.
  correct: 1
  explanation: >-
    The Marcus barrier (dG + lambda)^2/(4 lambda) is zero at -dG = lambda. At 1.8 eV the reaction is in
    the inverted region and slower by a factor of about exp(-12), still possible but much slower.
- id: q3
  question: >-
    Two redox centres must exchange an electron within 1 ms at the optimum driving force. Using the
    tunnelling timetable (1e13 s-1 at 3 Angstrom, beta = 1.1 per Angstrom), what is the largest distance?
  options:
    - About 9 Angstrom, from ln(1e13)/beta without the contact distance.
    - About 50 Angstrom, because tunnelling falls off slowly in proteins.
    - About 14 Angstrom, because no protein electron transfer exceeds that.
    - About 24 Angstrom, from r = 3 + ln(1e13/1e3)/1.1.
  correct: 3
  explanation: >-
    k = 1e3 s-1 needs exp(-1.1(r - 3)) = 1e-10, so r - 3 = 23.03/1.1 = 20.9 and r is about 24 Angstrom.
    Longer distances need a chain of cofactors.
- id: q4
  question: >-
    A resting person uses 250 mL of O2 (STPD, 22.4 L/mol) per minute. What electron current flows to O2
    at cytochrome c oxidase?
  options:
    - About 72 A, from 4 F times 1.86e-4 mol O2 per second, four electrons per O2.
    - About 18 A, from F times the O2 moles per second, one electron per O2.
    - About 36 A, from 2 F times the O2 moles per second, per O atom.
    - About 4300 A, from 4 F times the O2 moles per minute, not per second.
  correct: 0
  explanation: >-
    250 mL/min is 0.0112 mol/min or 1.86e-4 mol/s. Each O2 takes four electrons, so I = 4 x 96485 x
    1.86e-4 = 72 A.
