- id: q1
  question: >-
    While filling in your notebook you realise you wrote 163 g, but the scale showed 168 g.
    What is the correct way to fix it?
  options:
    - Erase 163 carefully and write 168 in the same place so the table stays neat.
    - Tear out the page and copy the whole entry again with the right value.
    - Strike 163 through with one line, write 168 beside it, and add a reason and initials.
    - Leave 163 and correct it later in the report, where the final values belong.
  correct: 2
  explanation: >-
    A notebook is a permanent record. A single strike keeps the original readable, and the reason and initials
    show who changed it and why. Erasing or recopying destroys the evidence.
- id: q2
  question: >-
    Which notebook line is the most useful record of a weighing?
  options:
    - "Water added to the mug: 50 g, weighed on the scale"
    - "Mug empty 312 g; mug + water 362 g (scale, 1 g steps)"
    - "Water about 50 g, as expected from 10 teaspoons"
    - "Mass of water 50.0 g ± 0.5 g (kitchen scale)"
  correct: 1
  explanation: >-
    Raw readings, with the instrument and its resolution, let anyone check the subtraction and judge the precision.
    The other lines record only a processed value, so the arithmetic and the source cannot be checked.
- id: q3
  question: >-
    Your five repeats of a volume measurement are 4.8, 5.1, 4.9, 5.2 and 5.0 mL. How should the result
    be written in the report?
  options:
    - "5.0 mL (five repeats; range 4.8–5.2 mL)"
    - "5.000 mL, the mean of five repeats"
    - "5 mL"
    - "5.0000 mL ± 0.4 mL"
  correct: 0
  explanation: >-
    The repeats already differ in the first decimal place, so one decimal is the honest precision.
    A result needs a value, its spread and a unit; extra digits claim precision you do not have.
- id: q4
  question: >-
    A reader of your report wants to know whether your density value agrees with the textbook value,
    and what limited your accuracy. Which section should answer this?
  options:
    - The Method section.
    - The Abstract.
    - The Results section.
    - The Discussion section.
  correct: 3
  explanation: >-
    The Discussion compares the result with a reference value, names the largest source of error and suggests
    an improvement. Results present the data and the final value; Method says how it was done.
