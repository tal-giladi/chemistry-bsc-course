- id: q1
  question: >-
    A peak at retention index 979 on a 5 % phenyl column gives library hits alpha-pinene (MF 951) and
    beta-pinene (MF 944). Library indices on that phase are 937 and 979. What do you report?
  options:
    - alpha-pinene, because it has the higher match factor.
    - beta-pinene, because only its retention index matches the measured one.
    - Both pinenes, as the two match factors differ by under 10 points.
    - Neither, because a match factor below 960 cannot identify a terpene.
  correct: 1
  explanation: >-
    The two pinenes give almost identical EI spectra, so a 7-point difference in MF means nothing. The
    retention index separates them: 979 matches beta-pinene exactly and is 42 units from alpha-pinene.
- id: q2
  question: >-
    Why is a GC-MS run started with a solvent delay of a few minutes, during which the filament is off?
  options:
    - The column needs those minutes to reach the starting oven temperature before data are recorded.
    - The solvent's ions would otherwise add to every later spectrum.
    - The huge solvent peak would overload the detector and wear out the filament.
    - The mass analyser cannot scan below m/z 35 until the vacuum recovers.
  correct: 2
  explanation: >-
    The solvent is thousands of times more abundant than any analyte. Switching the source off while it
    elutes protects the filament and detector; nothing of interest elutes in that window.
- id: q3
  question: >-
    The best hit for a large limonene peak scores 918, and 11 % of the ion current, mostly m/z 119 and
    134, is left after subtracting limonene. What is the most sensible next step?
  options:
    - Accept limonene and ignore the extra ions, since an MF above 900 is an excellent match.
    - Report the peak as unidentified, because a good match must explain all of the ions.
    - Re-tune the mass spectrometer, because the extra ions show a mass-calibration error here.
    - Search the residual and check an m/z 119 ion chromatogram for a co-eluting compound.
  correct: 3
  explanation: >-
    Ions not explained by the best hit suggest a second compound under the peak. m/z 119 and 134 fit
    p-cymene; an EIC of m/z 119 that peaks slightly earlier than the TIC, or a slower ramp, confirms it.
- id: q4
  question: >-
    A small late peak at RI 1191 matches gamma-terpinene with MF 861, but gamma-terpinene (RI 1061)
    already appears earlier in the same run. What does this most likely mean?
  options:
    - The true compound is missing from the library, so a wrong one came closest.
    - Gamma-terpinene eluted twice because the column was overloaded by the large limonene peak.
    - The alkane ladder was run on a different day, so all retention indices are shifted by 130 units.
    - MF 861 is too low to say anything; only matches above 950 carry information.
  correct: 0
  explanation: >-
    A library search always returns a best hit, even when the right spectrum is not in it. The RI rules
    gamma-terpinene out; adding alpha-terpineol (RI 1190) gives MF 973 and a matching index.
