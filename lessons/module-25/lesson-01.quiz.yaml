- id: q1
  question: >-
    A green drink gives A = 0.738 at 630 nm and A = 0.512 at 426 nm (1 cm). Blue dye absorptivities
    are 0.164 (630 nm) and 0.006 (426 nm) L/(mg cm); the yellow dye has 0.000 (630 nm) and 0.053
    (426 nm). What is the yellow dye concentration in the measured solution?
  options:
    - About 9.7 mg/L, from 0.512 / 0.053, because the yellow dye dominates at 426 nm.
    - About 4.5 mg/L, because both dyes are read at 630 nm where the blue dye is measured.
    - About 9.2 mg/L, after subtracting the blue dye's share of the 426 nm absorbance.
    - About 13.9 mg/L, from (0.512 + 0.738) / (0.053 + 0.037), summing both wavelengths.
  correct: 2
  explanation: >-
    At 630 nm only blue absorbs, so c_B = 0.738/0.164 = 4.50 mg/L. At 426 nm the blue dye contributes
    0.006 x 4.50 = 0.027, leaving 0.485 for yellow: 0.485/0.053 = 9.15 mg/L. Skipping that step gives
    a result about 6 % high.
- id: q2
  question: >-
    You replace the DVD piece in your spectrometer with a piece of CD (track spacing 1.6 micrometres
    instead of 0.74). What changes in the photo of the first-order spectrum?
  options:
    - The colours are spread over a much smaller angle, so the same wavelength range covers fewer pixels.
    - The colours are spread over a larger angle, so the spectrum no longer fits in the camera's view.
    - The spectrum is unchanged, because the angle depends only on the wavelength of the light.
    - The rainbow disappears, because a CD has too few tracks per millimetre to diffract visible light.
  correct: 0
  explanation: >-
    From d sin(theta) = lambda, a larger d gives smaller angles: 546 nm leaves a CD at about 20 degrees
    instead of 48. The spectrum is compressed onto fewer pixels, so the nanometres per pixel get worse.
- id: q3
  question: >-
    Your blue-dye series reads A = 0.12, 0.24, 0.36, 0.60, 0.83 and 1.13 for fractions 0.1, 0.2, 0.3,
    0.5, 0.7 and 1.0 of the stock. The blank photo shows no clipped pixels. What is the best next step?
  options:
    - Fit all six points with a straight line, since more points always give a better slope.
    - Fit the points up to 0.5, and dilute anything that reads above about 0.7 into that range.
    - Retake the series at higher exposure, so that the strongest solutions become brighter.
    - Switch from the blue to the green channel, because blue dyes are best read in green light.
  correct: 1
  explanation: >-
    The top points fall below the line: stray light and the wide bandwidth bend a phone calibration at
    high absorbance. Use the straight part only and dilute samples into it, as in Lesson 19.1.
- id: q4
  question: >-
    After calibration with a fluorescent lamp, your lamp lines miss their known wavelengths by -12, +18,
    -9 and +4 nm. The dye peaks look sensible. What is the most likely cause?
  options:
    - The DVD piece is too small, so the lines are too faint to locate accurately.
    - A quadratic calibration is too flexible; a straight line would fit these lines better.
    - The camera's white balance shifted the colours, which moves every line by a few nanometres.
    - One of the peaks used is a broad phosphor band, not a mercury line, so the assignment is wrong.
  correct: 3
  explanation: >-
    A correct assignment of sharp mercury lines fits within about 1-2 nm. Residuals of 10-20 nm mean a
    peak was matched to the wrong wavelength, typically a terbium phosphor band near 487 nm taken for a
    mercury line. Re-check which lines are sharp and refit.
