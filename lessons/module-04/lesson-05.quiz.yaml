- id: q1
  question: >-
    A photochemist needs photons of at least 3.0 eV to start a reaction. Which lamp can do it, in
    terms of photon energy?
  options:
    - A bright red lamp at 650 nm, because high power makes up for the colour.
    - A green lamp at 530 nm, because green light is the most energetic part of sunlight.
    - An infrared heat lamp at 1000 nm, because it warms the sample most.
    - A violet lamp at 400 nm, because 1239.84/400 = 3.1 eV for each photon.
  correct: 3
  explanation: >-
    Each photon must carry the energy, and E in eV is 1239.84 divided by the wavelength in nm. Only
    400 nm gives more than 3.0 eV. Brightness adds photons, not energy per photon.
- id: q2
  question: >-
    You double the brightness of a monochromatic light on a metal that already emits photoelectrons.
    What changes?
  options:
    - Twice as many electrons per second, each with the same maximum energy.
    - The maximum energy of each electron doubles; their number per second stays the same.
    - Both the number and the maximum energy of the emitted electrons double.
    - Nothing changes, because the frequency and so the photon energy are the same.
  correct: 0
  explanation: >-
    Brightness is the number of photons per second, so more electrons come out. Each photon still
    has the same energy h nu, so each electron's maximum energy is unchanged.
- id: q3
  question: >-
    In the LED practical your four turn-on voltages give a straight line against 1/lambda with
    slope 1.10e-6 V m. What value of h do you report?
  options:
    - 1.10e-6 J s, the slope itself.
    - 5.88e-34 J s, from slope times e/c.
    - 3.30e2 J s, from slope times c.
    - 1.76e-25 J s, from slope times e.
  correct: 1
  explanation: >-
    The line is V0 = (hc/e)(1/lambda) + intercept, so h = slope times e/c = 1.10e-6 times
    1.602e-19 / 2.998e8 = 5.88e-34 J s, about 11 % below the exact value, typical for this method.
- id: q4
  question: >-
    An IR band of a C=O group appears at 1715 cm-1. Room-temperature thermal energy is about 2.5
    kJ/mol. Which statement is right?
  options:
    - The photon carries 1715 kJ/mol, so it can break the C=O bond.
    - The photon carries about 2.5 kJ/mol, so most molecules are already vibrationally excited.
    - The photon carries about 20.5 kJ/mol, about 8 RT, so most molecules start in v = 0.
    - The photon carries about 0.2 kJ/mol, so IR absorption is too weak to measure.
  correct: 2
  explanation: >-
    E = hc times the wavenumber: 1715 cm-1 is 0.213 eV, or 20.5 kJ/mol, about 8 RT. Few molecules are
    thermally excited, so absorption starts from the ground level. Bond energies are hundreds of kJ/mol.
