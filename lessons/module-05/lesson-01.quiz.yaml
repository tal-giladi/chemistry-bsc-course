- id: q1
  question: >-
    You ran pip install -r labs/common/requirements.txt, but check_setup.py, run with plain
    python, still reports "virtual environment: NO" and pandas MISSING. What most likely happened?
  options:
    - The requirements file is broken, because pandas 3.0.6 does not exist on PyPI.
    - Packages went into another Python, so call the .venv python with -m pip.
    - pandas needs a computer restart before Python can import it.
    - check_setup.py can only see packages installed with the classic Windows installer.
  correct: 1
  explanation: >-
    A bare pip or python can point at a system interpreter. Calling the environment's own
    interpreter with -m pip guarantees the packages land where your scripts run.
- id: q2
  question: >-
    A colleague's 2023 tutorial integrates a spectrum with np.trapz, and on your pinned NumPy 2.5.4
    it fails with an AttributeError. What is the best response?
  options:
    - Downgrade NumPy globally to the 2023 version so all old tutorials work again.
    - Report a bug, because a pinned NumPy should keep every function forever.
    - Use np.trapezoid, the documented replacement, and keep your pins.
    - Install Python 3.15, because newer interpreters restore removed functions.
  correct: 2
  explanation: >-
    np.trapz was deprecated in NumPy 2.0 and removed in 2.4. The current docs name np.trapezoid
    (or scipy.integrate) as the replacement; changing your code is safer than rolling back the stack.
- id: q3
  question: >-
    Python 3.15.0 came out a week ago. You are starting the course today. Which Python should you
    install, and why?
  options:
    - Python 3.15.0, because the newest release always has the most complete package support.
    - Any version from 3.8 on, because scientific packages support every Python 3 release.
    - Python 3.14 alone is not enough, so install both and let pip choose per package.
    - Python 3.14, because the course pins it and some packages may lack 3.15 builds.
  correct: 3
  explanation: >-
    Ready-made package builds often lag a new Python release by weeks. The pinned 3.14 line is
    current and supported, so every pinned package installs without compiling.
- id: q4
  question: >-
    Your script prints 0.30000000000000004 for 0.1 + 0.2 and the test "if total == 0.3" fails.
    What should you change?
  options:
    - Compare with a tolerance, for example math.isclose(total, 0.3).
    - Store all concentrations as integers in mol/L so no rounding happens.
    - Round every intermediate result to two decimals before adding.
    - Switch to a 64-bit Python, because 32-bit builds cause this error.
  correct: 0
  explanation: >-
    Binary floats approximate most decimals to about 1 part in 1e16. The tiny error is harmless,
    but exact equality tests break, so compare within a tolerance.
