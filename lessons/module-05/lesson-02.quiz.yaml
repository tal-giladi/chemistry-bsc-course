- id: q1
  question: >-
    You have absorbance spectra at 4 concentrations, stored as an array A of shape (4, 600), and
    the wavelength grid lam of shape (600,). You want the integrated absorbance of each spectrum.
    Which call gives it?
  options:
    - np.trapezoid(A, lam, axis=0), which integrates down the columns.
    - np.sum(A) * (lam[1] - lam[0]), which uses the grid step once.
    - np.trapezoid(A, lam, axis=-1), which gives one integral per spectrum.
    - np.trapz(A, lam), which is the standard name in NumPy 2.5.
  correct: 2
  explanation: >-
    The wavelengths run along the last axis, so integrate along axis -1 to get 4 numbers.
    axis=0 mixes concentrations, np.sum(A) lumps all spectra together, and np.trapz was removed in
    NumPy 2.4.
- id: q2
  question: >-
    T = np.array([280.0, 300.0, 320.0]) and Ea = np.array([40e3, 60e3, 80e3, 100e3]). You write
    np.exp(-Ea / (8.314 * T)) and get a ValueError. What is the simplest fix that gives a table of
    k values, one row per activation energy?
  options:
    - Make Ea a column with Ea[:, None], so shapes (4, 1) and (3,) broadcast to (4, 3).
    - Use math.exp instead of np.exp, because it accepts arrays of any length.
    - Add a fourth temperature so both arrays have length 4 and divide element by element.
    - Convert both arrays to Python lists, because numpy cannot combine different lengths.
  correct: 0
  explanation: >-
    Broadcasting needs each axis to be equal or 1. A column of 4 and a row of 3 combine into a
    4-by-3 grid. Padding T to length 4 runs but pairs each Ea with one T, which is not the table.
- id: q3
  question: >-
    Your Maxwell-Boltzmann code reports an area of 0.65 under the 500 K curve instead of 1.00.
    The formula is correct. What is the most likely cause?
  options:
    - Floating-point rounding in np.exp, which loses accuracy above 300 K.
    - The speed grid ends too early, so part of the high-speed tail is cut off.
    - The trapezoid rule always underestimates areas by about a third.
    - The distribution is only normalised at 298.15 K, by definition.
  correct: 1
  explanation: >-
    A normalised distribution integrates to 1 only over the full range. If the grid stops at, say,
    700 m/s, the hot curve's tail is missing; extend the grid until f is negligible.
- id: q4
  question: >-
    A classmate's figure shows measured cooling data as a smooth blue line and the fitted model as
    red dots, with the y axis labelled only "T". What is the most useful advice?
  options:
    - Use a logarithmic y axis, because cooling data always look better that way.
    - Remove the legend, because two colours are enough to tell the curves apart.
    - Increase the dpi to 300, because low resolution is why the plot is unclear.
    - Plot data as points and the model as a line, and label the axis with its unit.
  correct: 3
  explanation: >-
    Readers expect points for measurements and lines for models, and every axis needs a quantity
    with a unit, such as temperature in degrees C. Resolution and scale do not fix a misleading plot.
