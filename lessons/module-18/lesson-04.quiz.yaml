- id: q1
  question: >-
    [Fe(H2O)6]2+ has four unpaired electrons and [Fe(CN)6]4- has none. Both contain Fe(II). What explains
    the difference?
  options:
    - Cyanide oxidises iron to Fe(III), which has an even number of electrons.
    - Cyanide is strong-field, so Delta_o exceeds the pairing energy and all six pair in t2g.
    - Water forms a tetrahedral complex, which is always high spin.
    - The cyanide complex is square planar, which forces every electron to pair.
  correct: 1
  explanation: >-
    Fe(II) is d6. With water, Delta_o is below the pairing energy: high spin t2g4 eg2, 4 unpaired. CN- is
    near the top of the spectrochemical series (a pi acceptor), Delta_o is about 32 000 cm-1 and the
    complex is low spin t2g6.
- id: q2
  question: >-
    What is the crystal-field stabilisation energy of high-spin octahedral Mn2+ (d5)?
  options:
    - -2.0 Delta_o, because all five electrons occupy the lowered t2g set.
    - -1.2 Delta_o, because three electrons are in t2g as in Cr3+.
    - Zero, because three electrons at -0.4 and two at +0.6 cancel.
    - +0.6 Delta_o, because the two eg electrons raise the energy.
  correct: 2
  explanation: >-
    High spin d5 is t2g3 eg2: 3(-0.4) + 2(+0.6) = 0. Mn2+ gains nothing from the ligand field, which is
    why it fits on the smooth baseline of hydration enthalpies.
- id: q3
  question: >-
    Which complex has the largest Delta_o: [Co(NH3)6]2+, [Co(NH3)6]3+, [CoF6]3- or [Ir(NH3)6]3+?
  options:
    - "[Co(NH3)6]2+, because the lower charge lets the ligands come closer."
    - "[CoF6]3-, because fluoride carries a full negative charge."
    - "[Co(NH3)6]3+, because cobalt has the most d electrons of the four metals."
    - "[Ir(NH3)6]3+, because 5d orbitals overlap more strongly with the ligands."
  correct: 3
  explanation: >-
    Delta grows down a group (Co 22 870, Rh 34 100, Ir 41 200 cm-1 with NH3) and with metal charge. F- is
    a pi donor and weaker than NH3 despite its charge.
- id: q4
  question: >-
    [Co(H2O)6]3+ has Delta_o = 20 760 cm-1; the free Co3+ ion has a pairing energy of 23 625 cm-1. The
    complex is observed to be diamagnetic. Which statement resolves the apparent contradiction?
  options:
    - Pairing energy is smaller in a complex because the d electrons spread onto the ligands.
    - The splitting value must be wrong, because diamagnetism needs Delta_o above 30 000 cm-1.
    - Co3+ is d7, so it always has one unpaired electron regardless of Delta_o.
    - Water is a pi acceptor, which raises the splitting above the free-ion value.
  correct: 0
  explanation: >-
    The nephelauxetic effect lowers electron repulsion in complexes, so P drops below the free-ion value
    (about 0.8 x 23 625 = 18 900 cm-1). Delta_o then exceeds P and the complex is low spin t2g6.
- id: q5
  question: >-
    Almost every Cu(II) complex with six ligands has two trans bonds clearly longer than the other four.
    Why?
  options:
    - Cu(II) is d10, so it prefers linear coordination and the axial ligands drift away.
    - The axial ligands are always counter-ions that are not truly bonded.
    - The d9 ion has an unevenly filled eg set, and elongation lowers the energy (Jahn-Teller).
    - Cu(II) is always high spin, and high-spin complexes have longer axial bonds.
  correct: 2
  explanation: >-
    d9 is t2g6 eg3. Stretching along z lowers dz2, which holds two electrons, and raises dx2-y2, which
    holds one, for a net gain. Any uneven filling of a degenerate set drives such a distortion.
