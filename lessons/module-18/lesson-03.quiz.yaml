- id: q1
  question: >-
    A bottle is labelled [Co(NH3)4(H2O)Cl]SO4. What are the oxidation state and d-electron count of cobalt?
  options:
    - Co(+2), d7, because sulfate balances a +2 complex and chloride is a counter-ion.
    - Co(+1), d8, as ammonia and water each carry a partial negative charge.
    - Co(+4), d5, because sulfate is -2 and each ligand removes one electron.
    - Co(+3), d6, because the complex is +2 and the only charged ligand is Cl-.
  correct: 3
  explanation: >-
    Sulfate (-2) outside means the complex is +2. NH3 and H2O are neutral, Cl- is -1, so x - 1 = +2 and
    x = +3. Cobalt is in group 9: 9 - 3 = 6 d electrons.
- id: q2
  question: >-
    Two samples of [Pt(NH3)2Cl2] have the same formula, but only one binds two neighbouring DNA bases and
    works as a cancer drug. What kind of isomers are they?
  options:
    - Cis and trans stereoisomers of a square-planar complex.
    - Optical isomers of a tetrahedral complex.
    - Linkage isomers, with NH3 bound through H in one of them.
    - Ionisation isomers, with Cl- inside or outside the coordination sphere.
  correct: 0
  explanation: >-
    Pt(II) is d8 and square planar, so MA2B2 has a cis and a trans form. Cisplatin is the cis isomer; its
    two Cl- leave from neighbouring sites and the Pt binds two adjacent bases. A tetrahedral MA2B2 would
    have no isomers.
- id: q3
  question: >-
    How many stereoisomers, counting enantiomers separately, does octahedral [Co(en)2Cl2]+ have?
  options:
    - Two, cis and trans, because a chelate ring like en can never create chirality.
    - >-
      Three: the trans form is achiral, the cis form a mirror-image pair.
    - Four, because each en ligand can be oriented in two ways around the metal.
    - One, because the two en ligands force a single arrangement on the metal.
  correct: 1
  explanation: >-
    With the two Cl- trans, the complex has mirror planes. With them cis, the two en rings form a
    propeller that is not superimposable on its mirror image (Delta and Lambda). Total: 3.
- id: q4
  question: >-
    Ni2+ binds six NH3 with K = 4e8 and three en with K = 2e18, although both form six Ni-N bonds. What
    mainly causes the difference?
  options:
    - Each Ni-N bond to en is about twice as strong as a Ni-N bond to NH3.
    - The en complex is square planar, which is more stable for Ni2+.
    - Swapping 6 NH3 for 3 en releases three extra particles, a large entropy gain.
    - Ethylenediamine is a stronger acid than ammonia, so it donates more easily.
  correct: 2
  explanation: >-
    The chelate effect is mainly entropic: [Ni(NH3)6]2+ + 3 en -> [Ni(en)3]2+ + 6 NH3 goes from 4 to 7
    particles. The K ratio of 5e9 is 55 kJ/mol in Delta G standard.
- id: q5
  question: >-
    Iron-tablet powder turns black tea blue-black, and lemon juice then lightens it. Which explanation fits
    coordination chemistry?
  options:
    - Lemon juice oxidises the iron to a colourless Fe(IV) state.
    - Lemon juice dilutes the tea, so the same iron complex simply looks paler.
    - The tablet's coating dissolves in acid and absorbs the colour.
    - Acid protonates the polyphenol donors, and citrate competes for iron.
  correct: 3
  explanation: >-
    Fe3+ forms intensely coloured chelates with deprotonated gallate groups. Adding H+ removes the donor
    ability of those O atoms, and citrate is a competing chelating ligand: a ligand-substitution equilibrium
    shifts.
