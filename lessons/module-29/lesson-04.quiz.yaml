- id: q1
  question: >-
    An enzyme speeds a reaction 1e12-fold at 25 °C (RT = 2.48 kJ/mol). By how much does it lower the
    activation Gibbs energy?
  options:
    - About 30 kJ/mol, from RT times log10 of 1e12.
    - About 69 kJ/mol, from RT times ln of 1e12.
    - About 12 kJ/mol, one kJ/mol per factor of ten.
    - About 160 kJ/mol, from RT times 1e12 to the power one half.
  correct: 1
  explanation: >-
    ddG = RT ln(kcat/kuncat) = 2.48 x 27.6 = 69 kJ/mol. Using log10 instead of ln loses the factor 2.303.
- id: q2
  question: >-
    A mutant enzyme binds its substrate 100 times more tightly than the wild type, but binds the
    transition state no more tightly. What happens to kcat?
  options:
    - kcat falls, because the deeper ES well raises the barrier from ES to the transition state.
    - kcat rises 100-fold, because tighter binding always speeds catalysis.
    - kcat is unchanged, because only Km depends on substrate binding.
    - kcat rises, because the substrate spends more time in the active site.
  correct: 0
  explanation: >-
    kcat measures the climb from ES to the transition state. Stabilising ES alone lowers the start of
    that climb, so the barrier grows by RT ln 100, about 11 kJ/mol, and kcat falls.
- id: q3
  question: >-
    In the chymotrypsin mechanism, which role does His57 play when the acyl-enzyme is hydrolysed?
  options:
    - It is the nucleophile that attacks the ester carbonyl.
    - It holds the oxyanion through its backbone N-H.
    - It binds the hydrophobic side chain in the specificity pocket.
    - It is a general base that takes a proton from the attacking water.
  correct: 3
  explanation: >-
    Water is the nucleophile in deacylation; His57 removes its proton as it attacks, then returns a
    proton to Ser195 as the second tetrahedral intermediate collapses.
- id: q4
  question: >-
    A pH-rate profile of kcat/Km rises with pKa 6.9 and falls with pKa 8.9. At pH 6.0, what fraction of
    the maximal kcat/Km do you expect?
  options:
    - About 0.5, because pH 6 is near the first pKa.
    - About 0.9, because pH 6 is still within one unit of the pKa.
    - About 0.11, from 1/(1 + 10^0.9 + 10^-2.9).
    - About 0.01, because each unit below the pKa costs a factor of ten.
  correct: 2
  explanation: >-
    The active fraction is 1/(1 + 10^(pKa1 - pH) + 10^(pH - pKa2)) = 1/(1 + 7.9 + 0.001) = 0.11. At pH 6.0
    most of the His57 is protonated and cannot act as a base.
- id: q5
  question: >-
    Fresh pineapple stops gelatin from setting, but pineapple boiled for 5 minutes does not. What does this
    show most directly?
  options:
    - The acid in fresh pineapple dissolves the gelatin network.
    - The activity comes from a heat-sensitive protein that boiling unfolds.
    - Boiling removes the sugar that blocks gelatin from setting.
    - Gelatin sets only in the presence of cooked fruit.
  correct: 1
  explanation: >-
    Boiling leaves acid and sugar in place but unfolds the protease bromelain, which then cannot cut the
    gelatin chains. Only a protein catalyst explains the difference.
