- id: q1
  question: >-
    A student computes K for I2 = 2 I at 1000 K from partition functions and gets 2.0e-4 instead of about
    3e-3. Which single slip explains a factor of about 16?
  options:
    - Using De instead of D0 in the Boltzmann factor.
    - Leaving out the symmetry number of I2.
    - Leaving out the four-fold degeneracy of the I atom ground level.
    - Using the harmonic instead of the anharmonic vibrational partition function.
  correct: 2
  explanation: >-
    q_el(I) = 4 enters squared, so forgetting it divides K by 16. Using De lowers K by only 14 %, the missing
    sigma would make K 2 times too small, and the harmonic model changes K by about 1.5 %.
- id: q2
  question: >-
    Why does I2 dissociation, with Delta_r E0 = +148.8 kJ/mol, reach K = 1 at about 1450 K?
  options:
    - Above 1000 K the bond energy D0 falls, because the molecule is vibrationally excited.
    - Two atoms have far more accessible states, and the Boltzmann factor grows with T.
    - Collisions at high temperature supply the bond energy, so the reaction becomes exothermic.
    - The JANAF reference state changes at 1450 K, which sets K to 1 by definition.
  correct: 1
  explanation: >-
    K = (states ratio) x exp(-D0/RT). Two free atoms have about 1e5 times more states than one I2 at 1000 K;
    the Boltzmann factor rises from 1.7e-8 towards 1 as T grows. D0 is a fixed molecular property.
- id: q3
  question: >-
    You need K for I2 = 2 I at 1000 K to better than 5 %. Which input deserves the most care?
  options:
    - The rotational constant of I2, because q_rot is the largest internal factor.
    - The atomic mass of iodine, because q_trans depends on m to the power 3/2.
    - The 2P1/2 level of the I atom, because electronic levels decide K.
    - The dissociation energy D0, because a 1 % error changes K by about 16 %.
  correct: 3
  explanation: >-
    K depends exponentially on D0/RT = 17.9 at 1000 K, so a 1 % error in D0 is 0.18 in ln K. B and m are known
    to better than 0.01 %, and the 2P1/2 level holds only 9e-6 of the atoms at 1000 K.
- id: q4
  question: >-
    At 1000 K, K for I2 = 2 I is 3.1e-3. A lamp designer lowers the iodine pressure from 1 bar to 0.01 bar.
    What happens to the fraction of iodine present as atoms?
  options:
    - It rises from about 3 % to 27 %, as the side with more gas moles gains at low P.
    - It stays at 3 %, because K does not depend on pressure.
    - It falls, because fewer collisions are available at low pressure to break the bond.
    - It rises to 100 %, because K is fixed while the pressure term goes to zero as P falls.
  correct: 0
  explanation: >-
    alpha = sqrt(K / (K + 4 p/p°)): 0.028 at 1 bar, 0.27 at 0.01 bar. K is constant, but the composition
    that satisfies it shifts towards atoms as p falls (Le Chatelier).
- id: q5
  question: >-
    The spectroscopic K for I2 = 2 I is 1-3 % above the JANAF value from 500 to 1500 K. What is the most
    reasonable conclusion?
  options:
    - The JANAF table must be wrong, because it disagrees with a calculation from first principles.
    - Statistical thermodynamics only works for atoms, not for molecules with internal structure.
    - The separable rigid-rotor model misses small effects such as rotation-vibration coupling.
    - The error comes from treating iodine vapour as an ideal gas at 1 bar.
  correct: 2
  explanation: >-
    JANAF itself was computed from spectroscopic levels with more terms. In excited v the bond is longer and
    B smaller, so I2 has slightly more states than the model counts, which lowers K. Non-ideality at 1 bar
    and 1000 K is far below 1 %.
