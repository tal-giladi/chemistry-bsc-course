- id: q1
  question: >-
    You record the HCl fundamental at 4 cm-1 resolution and every R and P line looks like a single slightly
    asymmetric peak. Your B0 comes out 1 % low. What change to the measurement fixes this most directly?
  options:
    - Raise the pressure tenfold so that the weak high-J lines become stronger.
    - Average four times as many scans to reduce the noise on each peak.
    - Record at 0.5 cm-1 or better so the H35Cl and H37Cl partners are separated.
    - Heat the cell to 400 K so that more rotational levels are populated.
  correct: 2
  explanation: >-
    Each peak is an unresolved doublet about 2.1 cm-1 wide, so its maximum is pulled towards the H37Cl partner.
    Resolving the doublets removes the bias; more scans only reduce noise, and higher pressure broadens the lines.
- id: q2
  question: >-
    Fitting nu(m) with a quadratic in m leaves residuals with an S-shaped pattern of a few tenths of a cm-1
    in a 0.1 cm-1 spectrum of HCl. What is the right next step?
  options:
    - Drop the lines with the largest residuals, because they are probably blended.
    - Add a cubic term, because centrifugal distortion adds -2(D' + D'') m^3.
    - Fit the P and R branches separately, because they have different B values.
    - Switch to combination differences, because the polynomial fit is not valid at high J.
  correct: 1
  explanation: >-
    The S shape that grows as m cubed is the signature of centrifugal distortion. HCl has D near 5e-4 cm-1, which
    moves lines at m = 10 by about 2 cm-1, so at high resolution it must be in the model.
- id: q3
  question: >-
    From the fundamental (2886.0 cm-1) and the first overtone (5668.0 cm-1) you get omega_e x_e = 52.0 and
    omega_e = 2990 cm-1. The Morse dissociation energy D0 comes out 5.15 eV, but the real value is 4.43 eV.
    What is the best explanation?
  options:
    - The overtone centre is shifted by the isotope effect, which makes omega_e x_e too small.
    - The fundamental was measured at too low a pressure, so its centre is too high.
    - The Morse model extrapolates the curvature of the lowest levels to the top of the well, which overestimates its depth.
    - Zero-point energy was subtracted twice, once in G(0) and once in the band centre.
  correct: 2
  explanation: >-
    Two levels fix the curvature near the bottom of the well; how the real potential flattens near
    dissociation is not in them. Like the Birge-Sponer extrapolation of 20.4, the Morse estimate is too high.
- id: q4
  question: >-
    You fit H35Cl and H37Cl separately and find B0(37)/B0(35) = 0.99853, while rho squared from the atomic masses
    is 0.99849. Another student gets 0.9952 for the same ratio. What does the other result most likely mean?
  options:
    - Some lines were put in the wrong isotopologue list or numbered wrongly in one of the fits.
    - The chlorine in that sample had an unusual isotope ratio.
    - The temperature of that sample was higher, which changes B0 slightly.
    - Centrifugal distortion is larger for H37Cl, which lowers its B0 by about 0.3 %.
  correct: 0
  explanation: >-
    B scales with 1/mu to high accuracy, so the ratio is fixed by the masses whatever the sample or temperature.
    A ratio far from rho squared means the fit is wrong, almost always a mixed or mis-numbered line list.
