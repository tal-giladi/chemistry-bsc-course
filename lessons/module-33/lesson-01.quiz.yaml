- id: q1
  question: >-
    Which of these is a research question you could answer at home in 180 hours and that someone
    else could agree you answered?
  options:
    - How good is GFN2-xTB at predicting infrared spectra of organic molecules in general?
    - Why do some calculated vibrational frequencies differ from the measured ones?
    - What is the RMS error of GFN2-xTB C=O stretches for 30 carbonyls against NIST gas-phase data?
    - Which quantum chemistry program is the best choice for a self-taught chemist to learn?
  correct: 2
  explanation: >-
    It gives a number, names the population (30 carbonyls) and an independent reference (NIST gas-phase
    spectra). The others are topics or opinions with no defined answer or reference.
- id: q2
  question: >-
    A learner plans to model pKa values from the IUPAC digitized pKa dataset and later sell the model
    as part of a paid app. The dataset is licensed CC BY-NC 4.0. Which feasibility check does the plan fail?
  options:
    - The tools check, because pKa models need a commercial licence for the software.
    - The data check, because the licence allows non-commercial use with attribution only.
    - The safety check, because acids and bases are involved in pKa measurements.
    - The hours check, because more than 10,000 molecules can never fit in 180 hours.
  correct: 1
  explanation: >-
    NC means non-commercial. A project inside the course is fine with attribution, but the planned
    commercial use is not; the licence is part of the data check and is read on the day of download.
- id: q3
  question: >-
    Your data phase has 50 hours. You plan 120 titrations at 20 minutes of your own time each and expect
    to redo about 30 % of them. What does the budget say?
  options:
    - It needs 52 hours, so the plan does not fit; cut the number of samples or move hours.
    - It needs 40 hours, so the plan fits with 20 % margin as written.
    - It needs 2.6 hours, because the rerun factor applies only to the first ten samples.
    - It needs 31 hours, because reruns are normally done in the analysis phase.
  correct: 0
  explanation: >-
    120 x 20 min x 1.3 / 60 = 52 h, more than the 50 h planned. Forgetting the rerun factor gives
    40 h, which looks fine but is not.
- id: q4
  question: >-
    An ORCA frequency job takes 25 minutes of computer time per molecule and you will run 30 molecules
    with a rerun factor of 1.3. How should this enter your plan?
  options:
    - As about 16 hours of your own 180, in the data phase, since the computer works for you.
    - As nothing at all, since computer time is free and runs in the background.
    - As about 33 hours, since machine time must be doubled to cover overnight runs.
    - As about 16 hours of machine time, about two days of calendar time, not your attended hours.
  correct: 3
  explanation: >-
    Machine time does not use your attended hours, but it does need calendar days; plan it in days and
    budget only the minutes you spend building inputs and checking outputs.
