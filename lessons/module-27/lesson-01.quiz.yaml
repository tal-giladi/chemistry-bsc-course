- id: q1
  question: >-
    A sphere of radius 5 Å encloses a net charge of +0.2 e. Two ions with a total charge of -1 e sit just
    outside it. What is the electric flux out of the sphere?
  options:
    - (+0.2 e - 1 e)/ε₀, because every nearby charge changes the field on the surface.
    - Zero, because the outside charges cancel the inside charge on average.
    - +0.2 e/ε₀, as outside charges send in as many field lines as out.
    - +0.2 e/ε₀ only if the outside ions are far away compared with 5 Å.
  correct: 2
  explanation: >-
    Gauss's law counts only enclosed charge. Outside charges reshape the field on the surface, but each of
    their field lines that enters the sphere also leaves it, so their net flux is zero at any distance.
- id: q2
  question: >-
    Water has a static relative permittivity of about 80 but a refractive index of 1.333. Why does
    n = √εr fail so badly for water?
  options:
    - Water is magnetic, so its permeability differs from one at optical frequencies.
    - Molecular dipoles turn in a static field but cannot follow one oscillating at 10¹⁵ Hz.
    - The refractive index is measured at 20 °C and the permittivity at 25 °C.
    - Hydrogen bonds absorb visible light and lower the refractive index.
  correct: 1
  explanation: >-
    Maxwell's relation needs both quantities at the same frequency. At optical frequencies only the electron
    clouds respond (n² ≈ 1.78); in a static field the turning of permanent dipoles adds the rest.
- id: q3
  question: >-
    In a microwave oven rated 2450 MHz, neighbouring melted spots on a plate of cheese are 6.2 cm apart.
    What speed of light does this give?
  options:
    - 1.52 × 10⁸ m/s
    - 3.0 × 10⁸ m/s
    - 6.1 × 10⁸ m/s
    - 1.5 × 10⁶ m/s
  correct: 1
  explanation: >-
    Hot spots of a standing wave are half a wavelength apart, so λ = 12.4 cm and c = λf = 0.124 m × 2.45 × 10⁹ Hz
    = 3.0 × 10⁸ m/s. Taking the spacing as a full wavelength halves the answer.
- id: q4
  question: >-
    An empty capacitor cell reads 20.0 pF. Filled with a liquid it reads 45.6 pF. A student concludes the
    liquid is strongly polar. What should she check first?
  options:
    - Whether the liquid's n² is also near 2.3; if so, it is non-polar.
    - Whether it conducts, as only conductors raise the capacitance.
    - Whether the reading is above 80 pF, the threshold for any polar solvent.
    - Whether the cell was calibrated in a vacuum rather than in air at 1 atm.
  correct: 0
  explanation: >-
    εr = 45.6/20.0 = 2.28, typical of benzene or CCl₄. If n² is about the same, only electrons respond and the
    liquid is non-polar; a polar liquid would have εr much larger than n². Air changes the empty reading by only 0.05 %.
