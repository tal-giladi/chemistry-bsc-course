- id: q1
  question: >-
    Cycloheptatrienyl bromide (C7H7Br) dissolves in water as ions and behaves like a salt, unlike most
    alkyl bromides. What explains this?
  options:
    - The C-Br bond is unusually short and polar in a seven-membered ring, so it breaks.
    - Water adds to the double bonds of the ring and releases bromide.
    - The cation formed, C7H7+, is aromatic with 6 pi electrons, so it ionises easily.
    - The cation formed has 8 pi electrons, which fills the bonding orbitals.
  correct: 2
  explanation: >-
    The tropylium ion is planar, fully conjugated, with three C=C bonds and one empty p orbital: 6 pi
    electrons, 4n + 2 with n = 1. Aromatic stabilisation drives the loss of bromide.
- id: q2
  question: >-
    You need 1-(3-bromophenyl)ethanone from benzene using Br2/FeBr3 and CH3COCl/AlCl3. Which order works?
  options:
    - Bromination first, because bromine directs the incoming acetyl group to the meta position.
    - Acylation first, since acetyl directs meta and would block a later Friedel-Crafts.
    - Either order, because both of the groups direct the second one meta.
    - Neither order, because Friedel-Crafts never works on benzenes that already carry a substituent.
  correct: 1
  explanation: >-
    The acetyl group is a meta director, so it must be on the ring before bromination. Bromine directs
    ortho/para, so bromination first would give the para ketone.
- id: q3
  question: >-
    A student treats benzene with 1-chloropropane and AlCl3, expecting propylbenzene. What is the main
    product, and what should she do instead?
  options:
    - Propylbenzene, as expected, because Friedel-Crafts alkylation never rearranges.
    - Chlorobenzene; she should use FeCl3 instead of AlCl3 as the Lewis acid catalyst.
    - No reaction; benzene needs a nitro group on the ring before it can react.
    - Isopropylbenzene; acylate with propanoyl chloride, then reduce it.
  correct: 3
  explanation: >-
    The primary carbocation-like complex rearranges by a hydride shift to the secondary cation. Acylium
    ions do not rearrange, and the ketone can be reduced to CH2 afterwards.
- id: q4
  question: >-
    Why does nitration of anisole (methoxybenzene) give mainly the ortho and para products, and faster
    than benzene?
  options:
    - The O lone pair stabilises the sigma-complex when the charge sits on the C bearing OCH3.
    - The OCH3 group withdraws electrons by induction, which favours attack at ortho and para.
    - The methyl group of OCH3 blocks the meta positions sterically from attack.
    - Anisole is protonated by sulfuric acid, which makes it a fast-reacting meta director.
  correct: 0
  explanation: >-
    Ortho or para attack places the cation on the carbon attached to O, where the lone pair can donate
    by resonance to give an extra (oxonium) resonance form. This lowers the energy of the slow step.
