- id: q1
  question: >-
    A small molecule (D about 1e-9 m^2/s) takes about 0.2 s to diffuse across a 20 micrometre cell.
    Roughly how long would it take to cross a cell ten times wider, 200 micrometres?
  options:
    - About 2 s, because the time grows in proportion to the distance.
    - About 0.6 s, because the time grows with the square root of the distance.
    - About 20 s, because the time grows with the square of the distance.
    - About 0.2 s, because the diffusion coefficient does not change.
  correct: 2
  explanation: >-
    t = x^2/2D, so ten times the distance means a hundred times the time: 0.2 s becomes 20 s. This
    quadratic growth is why cells stay small and large organisms need circulation.
- id: q2
  question: >-
    A drug company has two candidate molecules of similar size. One is neutral and fairly nonpolar;
    the other carries a permanent positive charge. Which is more likely to enter cells without help?
  options:
    - The neutral nonpolar one, because it can dissolve in the oily core of the bilayer.
    - The charged one, because the inside of the cell is negative and attracts it through the lipid.
    - Both equally, because the membrane is only 5 to 10 nm thick.
    - The charged one, because charged molecules are more soluble in water on both sides.
  correct: 0
  explanation: >-
    To cross, a molecule must pass through a nonpolar core of permittivity about 2. Moving a charge
    from water into oil costs a large Coulomb energy, so ions need channels or carriers; the membrane
    potential cannot pull them through the lipid itself.
- id: q3
  question: >-
    You place red blood cells in a 0.30 mol/L glucose solution, and others in a 0.30 mol/L NaCl
    solution. Blood plasma is about 0.30 osmol/L. What happens?
  options:
    - Both sets stay normal, because both solutions are 0.30 mol/L.
    - Cells in glucose shrink and cells in NaCl swell, because NaCl particles are smaller and enter faster.
    - Both sets swell, because neither glucose nor NaCl can cross the membrane.
    - Cells in glucose stay about normal; cells in NaCl shrink, since it is about 0.6 osmol/L.
  correct: 3
  explanation: >-
    Osmolarity counts particles. Glucose gives one particle per molecule (0.30 osmol/L, isotonic);
    NaCl gives about two (0.57 to 0.60 osmol/L, hypertonic), so water leaves those cells.
- id: q4
  question: >-
    A cell has Na+ at 15 mM inside and 145 mM outside. What is the Na+ Nernst potential at 37 C
    (RT/F = 26.7 mV), inside relative to outside?
  options:
    - About -61 mV, from ln(15/145).
    - About +61 mV, from 26.7 mV times ln(145/15).
    - About +26 mV, from 26.7 mV times log10(145/15).
    - About +258 mV, from 26.7 mV times 145/15.
  correct: 1
  explanation: >-
    E = (RT/zF) ln(c_out/c_in) = 26.7 mV x ln(9.67) = 26.7 x 2.27 = +60.6 mV. Na+ is high outside, so
    the inside would have to be positive to stop it flowing in. Using log10 with RT/F mixes two forms.
