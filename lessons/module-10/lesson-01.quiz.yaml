- id: q1
  question: >-
    A student titrates 25 mL of 0.1 M acetic acid with 0.1 M NaOH using methyl red (colour change near
    pH 5) and gets 15.9 mL. The same titration with phenolphthalein gives 25.0 mL. What explains the
    difference?
  options:
    - The NaOH was not standardised, so one of the two results is affected by its wrong concentration.
    - Methyl red changes in the buffer region, with only two thirds of the acid used.
    - Phenolphthalein overshoots by about 9 mL, because it needs a large excess of base before it turns pink.
    - Acetic acid evaporates during the slower methyl red titration and less base is needed.
  correct: 1
  explanation: >-
    Before equivalence, a weak-acid titrand is an HA/A- buffer near its pKa of 4.76. At pH 5 the ratio
    A-/HA is about 1.75, so 64 % of the acid is used. Phenolphthalein changes above the jump, where the
    error is under 0.1 %.
- id: q2
  question: >-
    For 0.1 M HCl titrated with 0.1 M NaOH, which statement about indicator choice is correct?
  options:
    - Only phenolphthalein works, as the equivalence point of this titration lies above pH 8.
    - Only bromothymol blue works, because the equivalence point is exactly pH 7.
    - Methyl red, bromothymol blue, phenol red and phenolphthalein all give errors under 0.1 %.
    - No visual indicator works, so a pH electrode is needed for a strong acid.
  correct: 2
  explanation: >-
    For a strong acid at 0.1 M the jump runs from about pH 4 to 10, so a fraction of a drop moves the pH
    across all of these windows. Only methyl orange (pH 3.7) starts noticeably early, at about 0.4 %.
- id: q3
  question: >-
    A burette budget has three terms: tolerance 0.029 mL, reading 0.028 mL and end point 0.014 mL
    (standard uncertainties). What is the combined standard uncertainty of the volume?
  options:
    - 0.071 mL, the sum of the three terms.
    - 0.029 mL, because only the largest term really matters here.
    - 0.024 mL, the average of the three terms.
    - 0.043 mL, the square root of the sum of the squares.
  correct: 3
  explanation: >-
    Independent uncertainties add in quadrature: sqrt(0.029^2 + 0.028^2 + 0.014^2) = 0.043 mL. Adding
    them linearly overstates the uncertainty because the errors are unlikely all to have their largest
    value in the same direction.
- id: q4
  question: >-
    A lab makes 0.1 M NaOH by weighing pellets and dissolving them in 1 L. Why must it still be titrated
    against KHP before use?
  options:
    - Solid NaOH takes up water and CO2 from the air, so the weighed mass is not all NaOH.
    - NaOH reacts with the glass of the volumetric flask, so the volume is not exactly 1 L.
    - KHP titrations are required by law for every solution made in a laboratory.
    - The NaOH concentration rises over time as water slowly evaporates through the bottle cap.
  correct: 0
  explanation: >-
    NaOH is hygroscopic and absorbs CO2, so it is not a primary standard. KHP is pure, stable and
    non-hygroscopic, so a weighed amount gives an exact number of moles to standardise against.
- id: q5
  question: >-
    At home you find that one drop from your syringe weighs 45 mg and a vinegar titration uses about 7 g
    of titrant. What does this mean for your results?
  options:
    - The drop size does not matter because the titrant is weighed, not measured by volume.
    - The end point is known only to about 0.6 %; repeats that agree better are luck.
    - The drop is too small to see, so you should switch to adding titrant 1 mL at a time.
    - Each result will be 0.6 % high, so you must subtract the mass of one drop from every titration.
  correct: 1
  explanation: >-
    Weighing measures what was delivered, but you can only stop at a whole drop, so 0.045/7 = 0.6 % is
    the resolution of the end point. It is a random-looking term in the budget, not a fixed correction.
