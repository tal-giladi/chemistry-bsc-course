- id: q1
  question: >-
    4-Chlorobenzoic acid has pKa 3.99 and benzoic acid 4.20 in water at 25 degrees C. What is
    sigma_p for chlorine, and what does its sign mean?
  options:
    - -0.21, so chlorine donates electrons to the ring from the para position.
    - +0.21, so chlorine withdraws electrons and stabilises the carboxylate.
    - +0.48, because sigma is the natural logarithm of the ratio of the two Ka values.
    - +1.05, because sigma is the ratio of the two pKa values.
  correct: 1
  explanation: >-
    sigma = pKa(parent) - pKa(substituted) = 4.20 - 3.99 = +0.21 (table value 0.23). A positive sigma
    means an acid-strengthening, electron-withdrawing group; the scale uses log10, not ln.
- id: q2
  question: >-
    A reaction of substituted benzyl derivatives gives a straight Hammett plot with rho = -3.3. What
    does this suggest about the rate-determining transition state?
  options:
    - Negative charge builds up at the benzylic carbon, so acceptors speed the reaction.
    - The reaction is insensitive to substituents, because rho is far from 1.
    - Positive charge builds up near the ring, so donors speed the reaction strongly.
    - The mechanism must be radical, because ionic reactions always have positive rho.
  correct: 2
  explanation: >-
    A negative rho means electron-donating groups (negative sigma) increase the rate, so positive charge
    develops near the ring; a magnitude above 1 means it is more sensitive than benzoic acid ionisation.
- id: q3
  question: >-
    Phenols give rho = 2.1 with normal sigma, but 4-nitrophenol (pKa 7.15) is about 1.2 pKa units
    more acidic than the line predicts. What is the best explanation?
  options:
    - The phenoxide charge delocalises onto the para nitro group, so sigma-minus applies.
    - The nitro group is ortho to the OH group, so steric effects distort the measured value.
    - The measurement must be wrong, because a Hammett line fits every para substituent.
    - Nitro groups donate electrons by resonance, so sigma-plus applies instead.
  correct: 0
  explanation: >-
    In 4-nitrophenoxide the negative charge spreads onto the nitro oxygens through the ring. That extra
    stabilisation is not in sigma_p (benzoic acid cannot do it), so an effective sigma-minus of about 1.3-1.4 is needed.
- id: q4
  question: >-
    Alkaline hydrolysis of ethyl benzoates has rho = +2.54. Using sigma_m(CF3) = 0.43, how much faster
    should ethyl 3-(trifluoromethyl)benzoate hydrolyse than ethyl benzoate?
  options:
    - About 3 times faster, because rho times sigma is 1.09.
    - About 1.1 times faster, because the CF3 group is meta and acts only weakly.
    - About 3 times slower, because CF3 donates by hyperconjugation.
    - About 12 times faster, because 10 to the power 1.09 is 12.
  correct: 3
  explanation: >-
    log(k/kH) = 2.54 x 0.43 = 1.09, so k/kH = 10^1.09 = 12. Taking rho x sigma itself as the factor is a
    common slip; the Hammett equation gives a logarithm.
