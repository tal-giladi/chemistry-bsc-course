- id: q1
  question: >-
    A liquid C4H8O2 shows a strong band at 1742 cm-1, two strong bands at 1240 and 1050 cm-1, and
    nothing above 3000 cm-1. Which class of compound is it?
  options:
    - An ester, because the C=O is near 1740 and strong C-O bands are present.
    - A ketone with an ether group, because 1742 is a normal ketone band.
    - A carboxylic acid, because C4H8O2 has two oxygens and a C=O.
    - An aldehyde, because aldehyde C=O bands are the highest of the carbonyls.
  correct: 0
  explanation: >-
    An ester has its C=O at 1735-1750 and strong C-O bands at 1000-1300. An acid would show the very
    broad O-H from 2500 to 3300, and an aldehyde the weak C-H pair near 2720 and 2820.
- id: q2
  question: >-
    You compare the NIST spectrum of ethanol with an SDBS spectrum. NIST shows a sharp O-H band near
    3650 cm-1; SDBS shows a broad band centred near 3330 cm-1. What is the best explanation?
  options:
    - The NIST sample was wet, so its band is from water, not ethanol.
    - The two databases use different units, one in wavenumbers and one in wavelength.
    - SDBS used a deuterated sample, which moves the O-H band to lower wavenumber.
    - NIST measured the gas, where O-H is not hydrogen-bonded; SDBS measured the liquid.
  correct: 3
  explanation: >-
    In the gas, molecules are far apart and the free O-H gives a sharp band near 3650. In the
    liquid, hydrogen bonds weaken the O-H bond and spread the band over 3200-3550.
- id: q3
  question: >-
    Why does a C-D bond absorb near 2200 cm-1 when a C-H bond absorbs near 3000 cm-1?
  options:
    - Deuterium makes a stronger bond, so the force constant is larger.
    - The reduced mass nearly doubles while the force constant stays the same.
    - The C-D vibration does not change the dipole, so it shifts to a lower band.
    - Deuterium makes a weaker bond, so the force constant is about half as large.
  correct: 1
  explanation: >-
    Isotopes do not change the bonding, so k is the same. The wavenumber goes as the square root of
    k divided by mu, and mu rises from about 0.93 u to 1.72 u, which lowers it by a factor of 1.36.
- id: q4
  question: >-
    A hydrocarbon C8H14 shows a strong narrow band at 3310 cm-1 and a weak band at 2120 cm-1. What
    structural feature do these bands show?
  options:
    - A nitrile, since triple bonds near 2120 cm-1 must contain nitrogen.
    - An alcohol, because bands above 3200 are always O-H stretches.
    - A terminal alkyne, with its sharp C-H stretch and a weak C-C triple-bond stretch.
    - An alkene, because sp2 C-H stretches appear above 3000 cm-1.
  correct: 2
  explanation: >-
    A hydrocarbon has no O or N, so 3310 cannot be O-H or N-H. A narrow band near 3300 is the sp C-H
    of a terminal alkyne, and the weak 2120 band is its C-C triple bond.
