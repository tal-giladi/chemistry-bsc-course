- id: q1
  question: >-
    The pure rotational spectrum of a diatomic molecule shows lines spaced 3.84 per cm apart. What
    is its rotational constant B?
  options:
    - 3.84 per cm, because the spacing equals B.
    - 7.68 per cm, because each line is a jump of two levels.
    - 1.92 per cm, because the lines are spaced by 2B.
    - 0.96 per cm, because the J(J+1) factor adds another factor of two.
  correct: 2
  explanation: >-
    Lines lie at 2B(J+1), so neighbours differ by 2B. A spacing of 3.84 per cm gives B = 1.92 per cm,
    which is carbon monoxide.
- id: q2
  question: >-
    You put the electron of a hydrogen atom in a state with n = 3. Which set of quantum numbers is
    not allowed?
  options:
    - l = 2, m = -2, a 3d orbital.
    - l = 1, m = 0, a 3p orbital.
    - l = 0, m = 0, a 3s orbital.
    - l = 3, m = 1, a 3f orbital.
  correct: 3
  explanation: >-
    l runs from 0 to n - 1, so for n = 3 the largest l is 2. There is no 3f orbital; f orbitals first
    appear at n = 4.
- id: q3
  question: >-
    Your radial solver gives the same energy, -0.125 hartree, for 2s and 2p. Is that a bug?
  options:
    - Yes, because 2s must lie below 2p, as in the aufbau order.
    - No, in a pure 1/r potential the energy depends only on n.
    - Yes, because the centrifugal term should raise 2p by a fixed amount.
    - No, because the solver ignores angular momentum entirely.
  correct: 1
  explanation: >-
    For one electron in a Coulomb potential, levels with the same n are degenerate. In many-electron
    atoms screening breaks the 1/r form and 2s drops below 2p.
- id: q4
  question: >-
    A heavier isotopologue has a moment of inertia twice as large. At the same temperature, what
    happens to its most populated rotational level?
  options:
    - It moves to higher J, about 1.4 times the J value.
    - It stays the same, because temperature alone sets the population.
    - It moves to lower J, because the levels are farther apart.
    - It moves to J = 0, because heavier molecules do not rotate.
  correct: 0
  explanation: >-
    B halves, so the levels crowd together and more are filled. J_max goes as the square root of
    kT/2B, so it grows by about the square root of 2.
