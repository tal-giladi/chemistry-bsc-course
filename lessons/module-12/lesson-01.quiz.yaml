- id: q1
  question: >-
    A hydrogen discharge tube shows a line at 434.05 nm in air (434.17 nm in vacuum). Which
    transition produced it?
  options:
    - n = 4 to n = 2, because 434 nm is the second visible Balmer line.
    - n = 5 to n = 2, because 1/lambda divided by R_H gives 1/4 - 1/25.
    - n = 5 to n = 1, because higher levels always fall to the ground state.
    - n = 3 to n = 2, because red and violet lines come from the same jump.
  correct: 1
  explanation: >-
    1/lambda = 2.3032e6 per metre; divided by R_H = 1.0968e7 per metre this is 0.2100 = 1/4 - 1/25.
    It is H-gamma. The n = 4 to 2 line is at 486 nm.
- id: q2
  question: >-
    You want to know whether quantum effects matter for a particle. Which comparison decides it?
  options:
    - Its mass against the mass of a proton.
    - Its speed against the speed of light.
    - Its kinetic energy against the thermal energy k_B T.
    - Its de Broglie wavelength against the size of the region confining it.
  correct: 3
  explanation: >-
    Quantisation appears when the wave does not fit freely in its space: lambda = h/p comparable to
    the confinement length. Mass and energy matter only through lambda.
- id: q3
  question: >-
    You fit 1/lambda against (1/4 - 1/n^2) for the Balmer lines and get a slope 300 ppm above
    R_inf/(1 + m_e/m_p). What is the most likely cause?
  options:
    - You used air wavelengths without converting them to vacuum.
    - You used R_inf instead of R_H in the comparison value.
    - Hydrogen levels do not follow 1/n^2, so the slope is biased.
    - The fit needed a quadratic term to absorb the fine structure.
  correct: 0
  explanation: >-
    Air's refractive index is about 1.00028, so air wavelengths are about 280 ppm short and 1/lambda
    too large. The comparison value already includes the reduced-mass correction.
- id: q4
  question: >-
    An electron is squeezed from a 0.2 nm region into a 0.1 nm region. By the uncertainty
    principle, what happens to its minimum kinetic energy?
  options:
    - It halves, because the electron has less room to move.
    - It stays the same, because the energy depends only on the charge.
    - It about quadruples, because it scales as one over the length squared.
    - It doubles, because momentum spread scales as one over the length.
  correct: 2
  explanation: >-
    Delta p is at least hbar/(2 Delta x), and the kinetic energy goes as (Delta p)^2/2m, so halving
    the length raises the minimum energy about four times.
