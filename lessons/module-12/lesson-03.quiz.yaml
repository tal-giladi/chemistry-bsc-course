- id: q1
  question: >-
    An STM runs at constant current. The tip passes over a step one atom high (about 0.2 nm). With
    kappa = 10 per nm, how would the current change if the feedback loop were switched off?
  options:
    - It would roughly double, because the gap shrinks by about a third.
    - It would rise about 55 times, because the current goes as exp(-2 kappa d).
    - It would rise about 7 times, because the current goes as exp(-kappa d).
    - It would not change, because tunnelling does not depend on the gap.
  correct: 1
  explanation: >-
    The current is proportional to exp(-2 kappa d). Shrinking d by 0.2 nm multiplies it by exp(2 x 10
    x 0.2) = exp(4), about 55. This sensitivity is why the tip height maps atoms.
- id: q2
  question: >-
    A reaction transfers a hydrogen atom. Replacing H with D slows it 60 times, and the rate hardly
    changes between 5 and 40 degrees C. What is the best interpretation?
  options:
    - The hydrogen crosses the barrier mainly by tunnelling rather than over the top.
    - The deuterium bond is weaker, so the reaction follows a different mechanism.
    - The zero-point energy difference alone explains a factor of 60 at room temperature.
    - The reaction is diffusion controlled, so isotopes and temperature do not matter.
  correct: 0
  explanation: >-
    Zero-point energy differences give H/D ratios up to about 7. A much larger ratio together with a
    weak temperature dependence is the classic signature of tunnelling through the barrier.
- id: q3
  question: >-
    For a fixed energy deficit, the transmission of a proton through a 0.05 nm barrier is 1e-4. About
    what is it for a deuteron through the same barrier?
  options:
    - 5e-5, half the proton value because the mass doubles.
    - 1e-8, the proton value squared because the mass doubles.
    - 1e-4, the same, because both particles carry the same charge.
    - About 2e-6, the proton value to the power of about 1.4.
  correct: 3
  explanation: >-
    T is about exp(-2 kappa d) with kappa proportional to the square root of mass. Doubling the mass
    multiplies the exponent by 1.41, so T becomes (1e-4)^1.41, about 2e-6.
- id: q4
  question: >-
    The inversion splitting of NH3 is 0.79 per cm and that of ND3 is 0.053 per cm. What does a
    smaller splitting mean physically?
  options:
    - ND3 has a lower barrier, so the two wells merge into one.
    - The deuterated molecule tunnels between its two shapes about 15 times more slowly.
    - ND3 is planar, so it has no double well and no splitting to measure.
    - The heavier atoms vibrate faster, so the levels move closer together.
  correct: 1
  explanation: >-
    The splitting divided by h is the flipping frequency between the two pyramids: 23.8 GHz for NH3
    against 1.6 GHz for ND3. The barrier is the same; the heavier mass tunnels less.
