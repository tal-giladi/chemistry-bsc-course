- id: q1
  question: >-
    You analyse a two-dye mixture at two wavelengths that both sit on the band of dye X. The
    calculation returns a negative concentration for dye Y. What is the most likely explanation?
  options:
    - >-
      Dye Y must have degraded in the cuvette, so its true concentration really is close to zero.
    - >-
      The two equations are nearly parallel, so small absorbance noise is amplified in c_Y.
    - >-
      Beer-Lambert does not apply to mixtures, so absorbances of the two dyes cannot be added.
    - >-
      The path length was left out, which flips the sign of the smaller concentration.
  correct: 1
  explanation: >-
    When both wavelengths see the two dyes in nearly the same ratio, the determinant is small and the
    condition number large. Noise in the absorbances then swings c_Y by more than its true value.
- id: q2
  question: >-
    You write the composition matrix for a reaction with 5 species and 3 elements. Its rank is 3.
    What does that tell you about balancing it?
  options:
    - The reaction is balanced uniquely, up to one overall scale factor for all species.
    - The reaction cannot be balanced at all with these species.
    - Two independent reactions fit the species, so chemistry must decide.
    - Exactly three of the coefficients must be zero.
  correct: 2
  explanation: >-
    The null space has dimension species minus rank, 5 - 3 = 2. Any combination of two independent
    reactions balances the atoms, so atom counting alone cannot fix the coefficients.
- id: q3
  question: >-
    A spectrometer gives absorbances of a two-component sample at 200 wavelengths. Which approach
    makes best use of the data?
  options:
    - >-
      Least squares on all 200 equations, then check that the residual matches the noise level.
    - >-
      Solve the 2x2 system at the two wavelengths with the largest absorbances and ignore the rest.
    - >-
      Solve every possible 2x2 pair of wavelengths and report the largest concentrations found.
    - >-
      Average the 200 absorbances first and solve one equation for the sum of both concentrations.
  correct: 0
  explanation: >-
    Least squares uses every measurement, so noise averages out, and a residual much larger than the
    noise warns that the two-component model is missing something.
- id: q4
  question: >-
    For the system 3x + 2y = 7 and x + 4y = 9, what is x?
  options:
    - x = 2.0, from (7 times 4 minus 9 times 2) divided by 10 with the sign flipped.
    - x = 1.3, from dividing 7 by 3 and then subtracting 1.
    - x = 0.8, from (7 times 4 minus 2 times 9) divided by 12.
    - x = 1.0, from (7 times 4 minus 2 times 9) divided by the determinant 10.
  correct: 3
  explanation: >-
    The determinant is 3 times 4 minus 2 times 1 = 10. Cramer's rule gives x = (7 times 4 - 2 times 9)/10
    = 1, and then y = (3 times 9 - 7 times 1)/10 = 2. Check: 3 + 4 = 7.
