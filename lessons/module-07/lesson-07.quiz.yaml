- id: q1
  question: >-
    Your balance shows +0.3 mg with nothing on it, and you cannot re-zero it. You need to know exactly how much
    solid you add to a flask. What do you do?
  options:
    - Weigh the solid on a paper and subtract 0.3 mg from the reading.
    - Weigh the weighing bottle with solid, tip some into the flask, weigh the bottle again, and take the difference.
    - Weigh the solid three times on the same paper and average the readings to remove the offset.
    - Use a graduated cylinder instead, because volume measurements have no offset.
  correct: 1
  explanation: >-
    In a difference of two readings the offset cancels, and what stays in the bottle is not counted as delivered.
    Subtracting a fixed offset fails if it drifts, and averaging cannot remove a systematic error.
- id: q2
  question: >-
    You must make a 1/100 dilution with the smallest uncertainty. Which choice is best, using Class A glassware?
  options:
    - 1.00 mL with a 1 mL graduated pipette into a 100 mL graduated cylinder.
    - 10.0 mL with a graduated cylinder into a 1000 mL beaker filled to the 1 L line.
    - 0.250 mL with a micro-syringe into a 25 mL volumetric flask.
    - 10.00 mL with a transfer pipette into a 1000 mL volumetric flask.
  correct: 3
  explanation: >-
    Transfer pipettes and volumetric flasks have the tightest tolerances, and larger volumes have smaller relative
    errors. Cylinders and beakers are for rough volumes, and a tiny aliquot carries a large relative error.
- id: q3
  question: >-
    An uncertainty budget for a standard gives relative uncertainties of 0.03 % (mass), 0.06 % (purity) and
    0.03 % (flask). To improve the result most, what should you change?
  options:
    - Use a purer, certified reagent, because purity is the largest term and dominates the squared sum.
    - Buy a balance ten times more precise, because mass is the first input in the formula.
    - Use a Class A flask twice the size, because volume is always the limiting term.
    - Repeat the whole preparation five times, because averaging reduces every term equally.
  correct: 0
  explanation: >-
    Terms add in quadrature, so the largest one dominates: the combined value is about 0.073 %, and removing the
    mass term only lowers it to about 0.067 %. Repeats do not reduce a systematic term like purity.
- id: q4
  question: >-
    A student reads a burette with the eye always a little above the meniscus, at both the start and the end of a
    titration. What is the effect on the delivered volume?
  options:
    - It is too large, because every reading taken from above is too large.
    - None, because parallax is a random error that averages out over many titrations.
    - It largely cancels if the bias is the same at both readings, since the volume is a difference.
    - It is twice the parallax error, because errors add when two readings are subtracted.
  correct: 2
  explanation: >-
    The delivered volume is a difference, so an identical bias in both readings cancels, just like a scale offset.
    In practice the eye height and the tube width at the two marks differ, so the habit still adds error.
