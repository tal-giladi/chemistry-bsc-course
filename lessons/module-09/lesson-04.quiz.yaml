- id: q1
  question: >-
    Seven blanks give s = 0.0015 absorbance units, and the calibration slope is 0.50 L/mg. A sample reads
    0.0060 above the mean blank. How should it be reported?
  options:
    - As 0.012 mg/L with its uncertainty, because any signal above the mean blank is a valid result.
    - As detected but below the LOQ, since 0.012 mg/L lies between the LOD and the LOQ.
    - As not detected, because the signal is below 10 times the blank standard deviation.
    - As 0.003 mg/L, because the LOD of 0.009 mg/L must be subtracted from the result.
  correct: 1
  explanation: >-
    LOD = 3 × 0.0015/0.50 = 0.009 mg/L and LOQ = 10 × 0.0015/0.50 = 0.030 mg/L. The sample at 0.012 mg/L is
    detected, but too close to the noise to be quantified with useful precision.
- id: q2
  question: >-
    A calibration from 0 to 10 mg/L gives R² = 0.9995, but the residuals form a clear arch: negative at both
    ends and positive in the middle. What does this mean?
  options:
    - The fit is excellent, because R² above 0.999 proves the response is linear.
    - The blank is contaminated, because the first residual is the negative one.
    - The line is the wrong model here; narrow the range or fit a curve.
    - The noise grows with concentration, so a weighted least-squares fit will remove the arch.
  correct: 2
  explanation: >-
    A systematic pattern in the residuals means the model is wrong, whatever R² says. An arch is curvature,
    often from detector saturation at the top; a funnel would point to unequal noise and a weighted fit.
- id: q3
  question: >-
    Seawater is analysed for a metal. A spike of 5.0 µg/L is recovered as only 4.1 µg/L, while the same spike
    in pure water is fully recovered. What is the best next step?
  options:
    - Use the method of standard additions, because the sample matrix lowers the sensitivity.
    - Prepare the external standards more carefully, as their concentrations must be wrong.
    - Multiply every result by 5.0/4.1, as recoveries are always constant across samples.
    - Measure more blanks, because a low recovery means the LOD is too high.
  correct: 0
  explanation: >-
    Full recovery in pure water but 82 % in seawater points to a matrix effect on the slope. Standard additions
    calibrate inside the sample itself. A single correction factor assumes every sample's matrix is the same.
- id: q4
  question: >-
    Your unknowns are all near 2 mg/L. Which set of standards gives the smallest uncertainty for them?
  options:
    - 0, 10, 20, 30, 40 and 50 mg/L, to cover as wide a range as possible.
    - Two standards at 1.9 and 2.1 mg/L, to keep the calibration as close to the unknowns as possible.
    - A single standard at 2.0 mg/L, read ten times, to average out the noise.
    - A blank and five standards from 0.5 to 4 mg/L, so the unknowns sit near the centre.
  correct: 3
  explanation: >-
    The uncertainty of a read-back concentration is smallest near the centre of the standards, and a spread of
    levels is needed to test linearity. Very wide ranges put the unknowns at the edge; two close standards
    give a poorly defined slope.
