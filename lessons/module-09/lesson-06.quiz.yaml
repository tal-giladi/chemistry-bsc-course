- id: q1
  question: >-
    You need a buffer at pH 7.4 that will absorb acid from many samples. Which choice is best?
  options:
    - "Acetic acid and acetate (pKa 4.76) in a 1 : 437 ratio, because Henderson–Hasselbalch gives pH 7.4."
    - Phosphate, H₂PO₄⁻ and HPO₄²⁻ (pKa 7.20), at a concentration sized for the acid the samples add.
    - Very dilute phosphate, because a lower concentration makes the pH more stable.
    - Ammonium and ammonia (pKa 9.24), because a higher pKa resists acid better.
  correct: 1
  explanation: >-
    Capacity is largest at pH = pKa and falls fast beyond pKa ± 1, so pick the acid with pKa nearest 7.4 and set
    its concentration from the capacity needed. An acetate mix at 7.4 has almost no acid form left to absorb base, and dilution cuts capacity.
- id: q2
  question: >-
    Buffer A is 0.20 M acetate at pH 4.76; buffer B is 0.020 M acetate at pH 4.76. How do they compare?
  options:
    - Same pH and same capacity, since capacity depends only on the ratio of acid to base.
    - B has the larger capacity, since dilute solutions change pH less when acid is added.
    - Same pH, but A absorbs about ten times more acid for the same pH change.
    - A has the lower pH, since the more concentrated acid releases more hydronium.
  correct: 2
  explanation: >-
    The pH depends on the ratio, which is the same; the capacity is proportional to the total concentration.
    That is why diluting a buffer "to save reagent" can ruin a method.
- id: q3
  question: >-
    A sulfate sample gives 0.4668 g of BaSO₄ (233.39 g/mol). How much sulfate (96.06 g/mol) did it contain?
  options:
    - 0.1921 g, from 0.4668 × 96.06/233.39.
    - 1.134 g, from 0.4668 × 233.39/96.06.
    - 0.4668 g, because the precipitate is weighed as sulfate.
    - 0.2747 g, from 0.4668 − 0.1921.
  correct: 0
  explanation: >-
    The gravimetric factor is M(analyte)/M(precipitate) times the stoichiometric ratio, here 1 : 1, so the
    sulfate is 0.4668 × 0.4116 = 0.1921 g. Inverting the factor gives more analyte than precipitate, which is impossible.
- id: q4
  question: >-
    In the phone-photo calibration, the three darkest standards fall below the straight line through the
    others. What should you do?
  options:
    - Keep all standards and report R², because more points always give a better calibration.
    - Raise the exposure until the darkest cups look lighter, then keep using the same line.
    - Remove the blanks, because the curvature comes from a wrong zero point.
    - End the linear range below them and dilute any sample that reads in that region.
  correct: 3
  explanation: >-
    Bending at high absorbance comes from stray light and is a real limit of this set-up. Fit only the linear
    part, report its upper end, and bring high samples into range by a known dilution.
