- id: q1
  question: >-
    A mass spectrum of an unknown compound shows two molecular-ion peaks two mass units apart, with heights in the
    ratio of about 3 to 1. What does this most likely tell you?
  options:
    - The molecule contains one bromine atom, because bromine has two isotopes.
    - The molecule contains one chlorine atom, as ³⁵Cl and ³⁷Cl occur in about a 3 to 1 ratio.
    - The molecule contains two chlorine atoms, because each chlorine adds one peak.
    - The molecule contains carbon, because ¹³C gives a peak a third the height of the main one.
  correct: 1
  explanation: >-
    Natural chlorine is about 76 % ³⁵Cl and 24 % ³⁷Cl, so one Cl gives an M and M+2 pair near 3:1. One bromine
    gives nearly 1:1, two chlorines give about 9:6:1, and ¹³C gives an M+1 peak, not M+2.
- id: q2
  question: >-
    The successive ionisation energies of an unknown element (in eV) are 7.6, 15.0, 80.1 and 109.3. In which group
    of the periodic table is the element most likely?
  options:
    - Group 1, because the first ionisation energy is low.
    - Group 13, because there are three low values before the big jump.
    - Group 2, because the big jump comes after the second electron.
    - Group 14, because four ionisation energies are listed.
  correct: 2
  explanation: >-
    Two electrons come off easily; the third must come from the core, so the energy jumps more than fivefold. Two
    valence electrons means group 2. These are the values for magnesium.
- id: q3
  question: >-
    You draw two Lewis structures for nitrous oxide, N₂O (atoms in the order N–N–O). In one, the formal charges are
    N 0, N +1, O −1. In the other, N −1, N +1, O 0. Which is the better single structure?
  options:
    - The first, because the negative charge sits on oxygen, the most electronegative atom.
    - The second, because the terminal nitrogen should be the atom carrying the negative charge.
    - Neither, because N₂O must have zero formal charge on every atom.
    - Both are equally good, because the total formal charge is zero in each.
  correct: 0
  explanation: >-
    Both have the same number of formal charges, so the tie-breaker is that negative charge belongs on the more
    electronegative atom. The real molecule is a resonance hybrid to which the first structure contributes more.
- id: q4
  question: >-
    A chemist needs a non-polar solvent whose molecules contain only carbon and chlorine, or carbon, hydrogen and
    chlorine. Which candidate fits?
  options:
    - CH₂Cl₂, because its two chlorines balance its two hydrogens.
    - CHCl₃, because its three chlorines spread evenly around carbon.
    - CH₃Cl, because it has only one polar bond, which is too weak to matter.
    - CCl₄, because its four equal bond dipoles cancel in a tetrahedron.
  correct: 3
  explanation: >-
    Only a fully symmetric arrangement cancels the bond dipoles. CH₂Cl₂, CHCl₃ and CH₃Cl each mix C–H and C–Cl
    bonds in a tetrahedron, so each has a net dipole moment.
- id: q5
  question: >-
    Propan-1-ol (C₃H₇OH, 60 g/mol) boils at 97 °C, while butane (C₄H₁₀, 58 g/mol) boils at about 0 °C. A student
    says the difference comes from the extra electrons of the oxygen atom. What is the better explanation?
  options:
    - Propanol has many more electrons, so its dispersion forces are much stronger.
    - Propanol is heavier, and heavier molecules always boil higher.
    - Propanol hydrogen-bonds through its O–H group; butane has only dispersion forces.
    - Butane molecules are straight chains, so they cannot touch each other along their length.
  correct: 2
  explanation: >-
    Both molecules have 34 electrons and nearly the same mass, so dispersion is similar. The O–H group lets
    propanol hydrogen-bond, which raises its boiling point by roughly a hundred degrees.
- id: q6
  question: >-
    A student mixes 4.0 g of H₂ with 16.0 g of O₂ to make water (2 H₂ + O₂ → 2 H₂O) and predicts 20.0 g of water.
    What is the most water that can form?
  options:
    - 18.0 g, with 2.0 g of H₂ left over, as O₂ is limiting.
    - 20.0 g, because mass is conserved in every chemical reaction.
    - 36.0 g, because 2 mol of H₂ gives 2 mol of water.
    - 9.0 g, because 0.5 mol of O₂ gives 0.5 mol of water.
  correct: 0
  explanation: >-
    H₂: 1.98 mol, divided by 2 is 0.99; O₂: 0.500 mol, divided by 1 is 0.500, so O₂ limits. It gives 1.00 mol of
    water, 18.0 g. Mass is conserved, but the unreacted 2.0 g of H₂ is not water.
- id: q7
  question: >-
    In the vinegar and baking soda experiment, one student weighed each cup only 2 minutes after mixing, so more
    CO₂ stayed dissolved than in a classmate's 15-minute run. Both used the same vinegar. What do you expect?
  options:
    - Both the rising slope and the break point are lower in the 2-minute run.
    - The slope is lower in the 2-minute run, but the break point is about the same.
    - The break point moves to a larger mass of baking soda in the 2-minute run.
    - Nothing changes, because the CO₂ formed depends only on the limiting reagent present.
  correct: 1
  explanation: >-
    Retained CO₂ makes every mass loss smaller, which lowers the rising line and the plateau. The corner is set by
    when the acid runs out, so it barely moves; that is why the break point gives the concentration.
- id: q8
  question: >-
    A nitrogen cylinder holds 50.0 L at 200 bar and 20 °C. A technician estimates the amount of gas with PV = nRT.
    NIST data give Z = 1.05 for N₂ at these conditions. How does the true amount compare with the estimate?
  options:
    - About 5 % larger, because Z above 1 means attractions pull extra molecules in.
    - The same, because nitrogen behaves as an ideal gas at room temperature.
    - About 5 % larger, because the molecules themselves take up part of the volume.
    - About 5 % smaller, because n = PV/(ZRT) is less than PV/RT when Z is above 1.
  correct: 3
  explanation: >-
    With Z = PVm/RT, the amount is n = PV/(ZRT), so Z = 1.05 means about 5 % less gas than the ideal estimate. Z
    above 1 shows that excluded volume dominates over attraction at this density.
- id: q9
  question: >-
    You must prepare 100.0 mL of a standard by weighing about 2 g of a 99.9 % pure reagent. You can use either
    (a) a 0.01 g pocket scale with a Class A 100 mL flask, or (b) a 0.1 mg analytical balance with a 100 mL
    graduated cylinder. Which is better?
  options:
    - (b), because the balance is a thousand times more precise and mass is the first input.
    - (a), because the cylinder's percent-level error would dominate the budget in (b).
    - (b), because a graduated cylinder is made to deliver and a flask only to contain.
    - Both are equal, because the reagent purity dominates in each case.
  correct: 1
  explanation: >-
    In (a) the mass term is about 0.2 % (0.004 g in 2 g) and the flask about 0.05 %. In (b) the cylinder's
    tolerance is around 0.5 to 1 %, which swamps the excellent mass. The largest term decides.
- id: q10
  question: >-
    A lab makes a 1/1000 dilution as three 1/10 steps with a 10 mL pipette and 100 mL flasks. Later they find that
    the pipette delivers 0.5 % too much every time. What is the error in the final solution?
  options:
    - About 0.5 %, because the error comes from only one piece of glassware.
    - Close to zero, because the three errors are random and partly cancel each other out.
    - About 1.5 % too concentrated, as the same bias enters every step and multiplies.
    - About 0.9 % too concentrated, because three errors add in quadrature as √3 × 0.5 %.
  correct: 2
  explanation: >-
    A systematic error repeats in every step, so the factors multiply: 1.005³ ≈ 1.015. Adding in quadrature
    applies only to independent random errors; a bias does not average out.
