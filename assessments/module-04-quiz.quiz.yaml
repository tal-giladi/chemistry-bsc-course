- id: q1
  question: >-
    A reaction needs to break a bond of about 1.0 eV per molecule. A colleague proposes running it by
    warming the flask from 25 C to 60 C. Thermal energy kT is about 0.026 eV at 25 C. What do you tell them?
  options:
    - kT rises only 12 %, still far below 1.0 eV; only rare fast molecules benefit.
    - kT more than doubles, which is enough for every single molecule to reach 1.0 eV.
    - Temperature has no effect on reactions, because kT is a fixed constant.
    - At 60 C kT equals 1.0 eV, so the bond breaks in every single collision.
  correct: 0
  explanation: >-
    kT scales with absolute temperature: 333/298 = 1.12. At about 0.029 eV it is still some 35 times
    below 1.0 eV, so only the rare molecules in the high-energy tail react, though more of them than
    at 25 C. Using Celsius instead of kelvin gives the "more than doubles" error.
- id: q2
  question: >-
    A computed potential-energy curve for a new diatomic molecule has a minimum at 0.150 nm and is
    steepest at 0.190 nm. You stretch the bond to 0.170 nm. What is true about the force there?
  options:
    - It is zero, because the bond is still shorter than the steepest point of the curve.
    - It points towards larger r, because the energy is higher than at the minimum.
    - It is the largest restoring force the bond can give at any length.
    - It pulls the atoms back towards 0.150 nm and is weaker than at 0.190 nm.
  correct: 3
  explanation: >-
    The force is minus the slope. Between the minimum and the steepest point the slope is positive
    and still rising, so the force pulls back towards the minimum and grows until 0.190 nm.
- id: q3
  question: >-
    The H-F stretch has a harmonic wavenumber near 4140 cm-1. A student predicts the D-F stretch.
    The reduced masses are about 0.957 u for HF and 1.821 u for DF. Which value is right?
  options:
    - About 2175 cm-1, from scaling by the ratio of the reduced masses.
    - About 3000 cm-1, from scaling by the root of the mass ratio.
    - About 4140 cm-1, because isotopes do not change the bond at all.
    - About 7880 cm-1, from scaling up by the ratio of the reduced masses.
  correct: 1
  explanation: >-
    The force constant is unchanged, and the wavenumber goes as 1/sqrt(mu): 4140 times
    sqrt(0.957/1.821) = 3001 cm-1. Using the plain mass ratio forgets the square root.
- id: q4
  question: >-
    You time 20 pendulum swings at five lengths and fit T squared against L. The slope is 4.10 s2/m.
    What value of g do you report?
  options:
    - 4.10 m/s2, the slope itself.
    - 0.244 m/s2, from one over the slope.
    - 9.63 m/s2, from 4 pi^2 over the slope.
    - 1.53 m/s2, from 2 pi over the slope.
  correct: 2
  explanation: >-
    T squared = (4 pi squared / g) L, so g = 39.48 / 4.10 = 9.63 m/s2. That is about 2 % below
    standard gravity; check the swing size and the length measurement.
- id: q5
  question: >-
    Two ions sit 0.40 nm apart. You move them from vacuum into water (relative permittivity about
    78) at the same distance. Their Coulomb energy in vacuum is -350 kJ/mol. What is it in water?
  options:
    - About -27 300 kJ/mol, because water strengthens the ionic attraction.
    - About -4.5 kJ/mol, below 2 RT, so thermal motion separates them.
    - About -350 kJ/mol, because the distance has not changed.
    - About -175 kJ/mol, because water halves the ionic attraction.
  correct: 1
  explanation: >-
    The energy is divided by the relative permittivity: -350/78 = -4.5 kJ/mol, less than 2 RT (about
    5 kJ/mol). That is why salts dissolve and dissociate in water.
- id: q6
  question: >-
    An electrochemical cell has a voltage of 1.10 V and transfers 2 electrons per formula unit of
    reaction. What is the maximum electrical work per mole of reaction?
  options:
    - 106 kJ/mol, from 1.10 V times the Faraday constant.
    - 2.20 kJ/mol, from 2 times 1.10.
    - 212 kJ/mol, from 2 x 96 485 C/mol x 1.10 V.
    - 3.5e-19 kJ/mol, from 2 times e times 1.10 V.
  correct: 2
  explanation: >-
    Work = nFE = 2 x 96 485 x 1.10 = 2.12e5 J/mol = 212 kJ/mol. Forgetting the 2 gives 106; using e
    gives the energy per formula unit, not per mole.
- id: q7
  question: >-
    In your resistor network the predicted node voltage, using the printed resistor values, is 1.85 V,
    but you measure 1.92 V. The battery reads the expected voltage under load. What do you do first?
  options:
    - Conclude that Kirchhoff's current law fails for real resistors.
    - Switch the meter to its current range and measure across the node.
    - Replace the battery, because a 4 % difference means a flat cell.
    - Measure each resistor out of circuit and redo the prediction.
  correct: 3
  explanation: >-
    Printed values have a 5 % tolerance, enough to explain a 4 % difference. With measured values
    the prediction usually agrees within about 1 %. A current range across a node is a short circuit.
- id: q8
  question: >-
    You need to know how much copper a 0.250 A current deposits from Cu2+ in 20.0 minutes, for a
    coulometry check. What is the expected mass?
  options:
    - 0.0988 g, from 300 C over 96 485 C/mol, halved for Cu2+, times 63.5 g/mol.
    - 0.198 g, from 300 C over 96 485 C/mol times 63.5 g/mol.
    - 0.00165 g, from 5.0 C over 96 485 C/mol, halved, times 63.5 g/mol.
    - 0.0494 g, from 300 C over 96 485 C/mol, quartered, times 63.5 g/mol.
  correct: 0
  explanation: >-
    Q = 0.250 x 1200 = 300 C, n(e) = 3.11e-3 mol, n(Cu) = 1.55e-3 mol (two electrons per Cu2+),
    mass 0.0988 g. Skipping the factor 2 gives 0.198 g; using minutes as seconds gives 0.00165 g.
- id: q9
  question: >-
    A dye absorbs strongly at 450 nm. A student says it must therefore absorb infrared light just as
    strongly, since "light of any wavelength carries energy". What is the best response?
  options:
    - Agreed, because every molecule absorbs every wavelength equally.
    - Agreed, because infrared photons carry even more energy than 450 nm photons.
    - No; 450 nm (2.76 eV) matches an electronic gap IR photons cannot reach.
    - No, because molecules can only ever absorb ultraviolet light.
  correct: 2
  explanation: >-
    A molecule absorbs a photon when its energy matches an energy gap. 450 nm is 1239.84/450 = 2.76
    eV, an electronic gap. IR photons (about 0.05-0.5 eV) can only excite vibrations, which form
    separate, unrelated bands.
- id: q10
  question: >-
    In the LED practical a blue LED turns on 0.3 V above hc/(e lambda), while the three other LEDs
    agree within 0.05 V. The fitted h comes out 25 % high. What is the sensible next step?
  options:
    - Report h as 25 % high and stop, since the method is approximate.
    - Refit with and without the blue LED; report both with the likely cause.
    - Replace the 150 ohm resistor with a wire so the blue LED gets more current.
    - Keep only the blue LED, because blue photons give the most reliable result.
  correct: 1
  explanation: >-
    One outlier at the end of the 1/lambda range pulls the slope strongly. Blue LEDs often use a
    different material, and data-sheet wavelengths are typical values. Showing both fits and naming
    the cause is honest analysis; removing the resistor would destroy the LED.
