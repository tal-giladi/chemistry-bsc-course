- id: q1
  question: >-
    A pollutant reacts with OH with k = 2.0e-13 cm3 molecule-1 s-1. Taking a mean OH concentration of
    1.0e6 molecules cm-3, what is its atmospheric lifetime against OH?
  options:
    - About 2 hours, because k times [OH] gives the lifetime directly in seconds.
    - About 58 days, from tau = 1/(k [OH]) = 5.0e6 s.
    - About 40 days, because the lifetime is ln 2 times the value 1/(k [OH]).
    - It cannot be found, because the reaction is second order and has no lifetime.
  correct: 1
  explanation: >-
    OH is held at a low steady level, so the loss is pseudo-first-order with k' = k[OH] = 2.0e-7 s-1
    and tau = 1/k' = 5.0e6 s, about 58 days. The half-life is tau ln 2, about 40 days.
- id: q2
  question: >-
    A lab doubles the starting concentration of a reactant and finds the half-life unchanged, then
    halves it and again finds the same half-life. A colleague says the reaction must be second order
    because the balanced equation has a coefficient of 2. Who is right?
  options:
    - The colleague, because orders follow the coefficients of the balanced equation.
    - Neither, because half-lives cannot reveal orders without an endpoint value.
    - "The data, which show first order: only that half-life ignores the starting concentration."
    - "The data, which show zero order: the rate does not change with concentration."
  correct: 2
  explanation: >-
    t1/2 is proportional to [A]0^(1-n); a constant half-life means n = 1. Coefficients give orders only
    for elementary steps, so the measurements win.
- id: q3
  question: >-
    A temperature-jump experiment on A <=> B gives a relaxation time of 50 microseconds. Independent
    measurements give K = [B]/[A] = 9 at the final temperature. What is kf?
  options:
    - 2.0e4 s-1, because kf is 1/tau.
    - 1.8e5 s-1, because kf is K/tau.
    - 2.2e3 s-1, because kf is 1/(K tau).
    - 1.8e4 s-1, because kf + kr = 1/tau and kf = 9 kr.
  correct: 3
  explanation: >-
    For A <=> B the system relaxes with kf + kr. With 1/tau = 2.0e4 s-1 and kf/kr = 9, kr = 2.0e3 s-1
    and kf = 1.8e4 s-1.
- id: q4
  question: >-
    A student follows a reaction by absorbance and fits ln(A_inf - A) against time, taking A_inf as the
    reading at 1.5 half-lives. She reports k = 0.090 min-1. A reading after ten half-lives is higher.
    What do you expect when she redoes the fit with the true endpoint?
  options:
    - A smaller k, because the early endpoint made the late points plunge on the ln plot.
    - A larger k, because the true endpoint lies further from the data.
    - The same k, because the endpoint only shifts the intercept of the ln plot.
    - A k that cannot be compared, because the true endpoint changes the order.
  correct: 0
  explanation: >-
    An endpoint taken too early makes A_inf - A approach zero too soon, so the logarithm falls steeply
    and k comes out too large. With the true endpoint the slope, and k, decrease.
- id: q5
  question: >-
    A reaction 2A + B -> P + C has rate = k[A]^2[B]/[C], where C is formed in a fast first step. Which
    mechanism is most consistent with this rate law?
  options:
    - A single termolecular collision of two A and one B, with C as a spectator.
    - A fast pre-equilibrium A + A <=> I + C, followed by a slow step I + B -> P.
    - A slow first step A + B -> I, followed by a fast step I + A -> P + C.
    - A chain reaction in which C is the chain carrier and B the initiator.
  correct: 1
  explanation: >-
    With a pre-equilibrium, [I] = K[A]^2/[C], and the slow step gives rate = k2 K [A]^2[B]/[C]. A product
    in the denominator is the fingerprint of a pre-equilibrium that it pushes back.
- id: q6
  question: >-
    A gas-phase decomposition is first order at 1 bar. At 5 mbar its rate constant is one third of the
    1 bar value, and it rises again when inert argon is added. What explains this?
  options:
    - Argon catalyses the reaction on the walls of the vessel.
    - The activation energy rises at low pressure, so the rate constant falls.
    - The reaction is in the Lindemann falloff region, where any collider energises it.
    - The reaction is really second order in the reactant, which falls with the pressure.
  correct: 2
  explanation: >-
    In the Lindemann mechanism k_uni = k0[M]k_inf/(k0[M] + k_inf). At low pressure activation by
    collisions limits the rate, so adding any collider M, even argon, raises k toward k_inf.
- id: q7
  question: >-
    Rate constants at 280, 300 and 320 K give a straight Arrhenius line with Ea = 14 kJ/mol for a
    hydrogen-abstraction reaction. An engineer extrapolates it to 1500 K. What is the main risk?
  options:
    - The rate at 1500 K is underestimated, because the local Ea rises with temperature.
    - The rate at 1500 K is overestimated, because Ea always falls at high temperature.
    - There is no risk, because three points on a straight line fix Ea at every temperature.
    - The units of k change at high temperature, so the extrapolation is meaningless.
  correct: 0
  explanation: >-
    Temperature-dependent prefactors (k = A T^n e^(-E/RT)) make Arrhenius plots curve upward. For OH +
    CH4 the local Ea climbs from about 14 to 34 kJ/mol, so a low-T line underestimates k in a flame.
- id: q8
  question: >-
    Two isomerisations have the same activation enthalpy. Reaction X has A = 1e16 s-1 and reaction Y has
    A = 1e11 s-1. Which statement fits?
  options:
    - X has a tight transition state and Y a loose one, since a large A means more order.
    - Both have the same entropy of activation, because their activation enthalpies are equal.
    - Y is the faster one, because a smaller A means fewer competing side reactions.
    - X has a loose transition state with positive activation entropy; Y a tight one.
  correct: 3
  explanation: >-
    A = e(kBT/h)exp(dS/R), with kBT/h near 6e12 s-1. A above about 1e13 s-1 means dS > 0 (bond fission,
    loose); far below means dS < 0 (ring closure or another tight transition state).
- id: q9
  question: >-
    An enzyme has Vmax = 0.80 mM/min and Km = 17 mM. A process runs at 2 mM substrate. Roughly what is
    the initial rate, and what controls it?
  options:
    - 0.80 mM/min, set by kcat, because an enzyme is always saturated.
    - 0.40 mM/min, set by Km, because the rate is half of Vmax at any substrate level.
    - About 0.084 mM/min, set by Vmax/Km, because 2 mM is well below Km.
    - About 6.8 mM/min, set by Km/Vmax, because low substrate frees the enzyme.
  correct: 2
  explanation: >-
    v = Vmax[S]/(Km + [S]) = 0.80 x 2/19 = 0.084 mM/min. Far below Km the reaction is close to first
    order with k = Vmax/Km, the specificity constant times the enzyme concentration.
- id: q10
  question: >-
    A biochemist fits enzyme time courses with the plain Michaelis-Menten law. In every run the model
    runs ahead of the data at long times, even with the best Vmax. What should she test next?
  options:
    - A larger enzyme concentration, because the fitted Vmax must be too small.
    - Product inhibition, adding P/KP to the denominator with a measured KP.
    - A zero-order model, because long times always follow zero-order kinetics.
    - Reporting only the early points, because late points are always less reliable.
  correct: 1
  explanation: >-
    A model that overshoots as products build up suggests the products bind to the enzyme. Michaelis and
    Menten added fructose and glucose terms in 1913; with them the fit residuals halve.
