- id: q1
  question: >-
    You have one evening to pick, from 25 search results, the papers worth using for a project on measuring
    nitrite in water with a phone. What is the most efficient plan?
  options:
    - Read the five most-cited papers in full, since citations show which ones matter.
    - Read every introduction carefully, since that is where the relevance to your project is explained.
    - Give each a 5–10 minute first pass, answer the five Cs, then second-pass only the best few.
    - Read only the titles, since the abstract repeats what the title already says.
  correct: 2
  explanation: >-
    A short first pass (title, abstract, introduction, headings, figures, conclusion) is enough to decide which
    papers deserve an hour. Citation counts measure attention; titles alone miss the method and the evidence.
- id: q2
  question: >-
    A paper's abstract says its relative errors against HPLC were "between 6 % and 16 %". In the table one
    sample reads 14.0 mg/L against an HPLC value of 12.6 mg/L, printed as 15.9 %. What is the right conclusion?
  options:
    - That entry recomputes to 11.1 %, a slip worth noting that does not by itself overturn the method.
    - The printed 15.9 % must be right, because peer reviewers check every number in a results table.
    - The whole paper is unreliable, because one wrong number means the data were fabricated.
    - The two numbers cannot be compared, because relative error depends on which method is the reference.
  correct: 0
  explanation: >-
    (14.0 − 12.6)/12.6 = 11.1 %. Checking a paper against its own numbers is cheap and useful; a single slip
    should be named precisely, with what it affects, rather than ignored or blown up into a verdict on the whole paper.
- id: q3
  question: >-
    A smartphone method has a detection limit 74 times higher than UV–vis. All samples contain far more dye than
    the phone's limit of quantification, and the legal limit is higher still. Your supervisor asks whether the
    phone method can be used to screen candies against the law. What do you answer?
  options:
    - No, because a method that is 74 times less sensitive cannot give reliable results for dyes.
    - Only after the phone method's detection limit has been brought down to the UV–vis value.
    - No, because detection limits from different instruments cannot be compared at all.
    - Yes, it is fit for purpose, since the concentrations that matter lie far above its limits.
  correct: 3
  explanation: >-
    Fitness for purpose asks whether the method answers the question asked. Sensitivity beyond what the
    decision needs adds nothing; speed and cost can then decide.
- id: q4
  question: >-
    For a calorimetry report you find the enthalpy of combustion of ethanol as 1371 kJ/mol (Wikipedia, citing a
    1937 review), 1336.8 kJ/mol (PubChem, citing a handbook) and −1367.6 ± 0.3 kJ/mol (NIST WebBook, a 1965
    calorimetric measurement). Which do you cite?
  options:
    - The Wikipedia value, because it cites a peer-reviewed review article from 1937.
    - The NIST entry, the original measurement with an uncertainty, matching an independent one.
    - The PubChem value, because the handbook it cites is a critically evaluated source.
    - The mean of all three values, so that no single source is unfairly favoured over the others.
  correct: 1
  explanation: >-
    Cite as close to the measurement as possible, with uncertainty and conditions. The PubChem number is an
    outlier, likely a copying slip, and averaging an error into a result makes it worse, not fairer.
- id: q5
  question: >-
    A chatbot's answer on vinegar titration cites a J. Chem. Educ. paper with a DOI. Crossref has no record of
    the DOI, and you find no typo. What do you do?
  options:
    - Cite it anyway with the journal name and year, since the DOI is only an extra detail.
    - Ask the chatbot again for the DOI, and cite it if the second answer matches the first.
    - Treat it as invented and do not use it unless you can find and read the paper itself.
    - Cite a different paper from the same journal on a similar topic in its place.
  correct: 2
  explanation: >-
    Articles from major chemistry publishers are registered with Crossref, so an unresolvable DOI with no typo
    strongly suggests the reference does not exist. Never cite a paper you have not found and read.
- id: q6
  question: >-
    A 2019 paper in a top journal supports a step in your plan. Crossref shows a "retraction" notice dated 2020
    and also a "correction" from 2019. How do you treat it?
  options:
    - Use it, because the 2019 correction shows the authors fixed the problems before the 2020 notice.
    - Use it but cite the correction notice instead of the paper.
    - Use it, because papers in top journals are reviewed more carefully than others.
    - Do not use it as evidence; a retraction withdraws the paper, whatever corrections came first.
  correct: 3
  explanation: >-
    A retraction means the journal or authors no longer stand behind the results, so it overrides earlier
    corrections. A journal's reputation does not protect a paper; the Arnold lactam paper was in *Science*.
- id: q7
  question: >-
    An unfamiliar journal invites you to publish your home vinegar study, promising peer review in 72 hours for
    a fee. Its website lists no named editors. What is the best judgement?
  options:
    - Likely predatory; check it against Think. Check. Submit. and DOAJ before going further.
    - It is likely fine, because fast review is a sign of an efficient editorial office.
    - It is fine as long as the fee is lower than that charged by established open-access journals.
    - It is fine if the journal's name sounds similar to a well-known chemistry journal.
  correct: 0
  explanation: >-
    Anonymous editors and very fast review for a fee are classic signs of no real peer review. Check the
    publisher, the board, the review process and the DOAJ listing; a familiar-sounding name is a common trick.
- id: q8
  question: >-
    Your five titrations give a mean of 4.9483 % w/w, SD 0.0210 %, 95 % CI half-width 0.0261 %. How do you
    write the result?
  options:
    - 4.9483 ± 0.0261 % w/w, to keep all the digits that were calculated.
    - 4.948 ± 0.026 % w/w (mean ± 95 % CI, n = 5).
    - 4.95 % w/w, very close to the label, with small errors.
    - 4.948 ± 0.021 % w/w, which is the uncertainty of the mean.
  correct: 1
  explanation: >-
    Round the uncertainty to two significant figures and the value to the same decimal place, and say what the
    "±" means and n. The SD describes single titrations, not the uncertainty of the mean, and "very close" carries no number.
- id: q9
  question: >-
    Six learners each did five titrations; one learner's mean is pulled down by a single spilled titration. Which
    figure lets a reader see this best?
  options:
    - A bar chart of the six means with standard deviation error bars.
    - A pie chart showing each learner's share of the total acid found.
    - A dot plot of all thirty titrations with each mean and its 95 % confidence interval.
    - A bar chart of the six means with the y-axis zoomed in to make the differences clearly visible.
  correct: 2
  explanation: >-
    With five points per group, plotting every point shows the outlier directly; bars show only the lowered mean,
    and a zoomed bar axis exaggerates differences. A pie chart answers a question nobody asked.
- id: q10
  question: >-
    Your blank-corrected result is 4.97 ± 0.04 g/100 mL (k = 2), and the label says 5.0 g/100 mL. A t-test on
    repeatability alone is significant. Which conclusion is best supported?
  options:
    - It agrees with the label within U, though it is slightly low on repeatability alone.
    - The measurement proves that the label value is wrong and should be corrected by the maker.
    - The measurement proves that the vinegar contains exactly what the label says.
    - Nothing can be concluded, because the t-test and the expanded uncertainty disagree.
  correct: 0
  explanation: >-
    The t-test uses only random scatter, while U also includes systematic terms such as titrant purity. A
    measurement supports or is consistent with a value; it never proves one, and the two tools answer different questions.
