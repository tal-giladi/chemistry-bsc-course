- id: q1
  question: >-
    A reaction has k = 2.0e-3 per second at 300 K and k = 1.0e-2 per second at 320 K. A colleague
    needs the activation energy for a reactor design. What value do you give?
  options:
    - About 27.9 kJ/mol.
    - About 64 kJ/mol.
    - About 7.7 kJ/mol.
    - About 0.85 kJ/mol.
  correct: 1
  explanation: >-
    ln(k2/k1) = (Ea/R)(1/T1 - 1/T2), so Ea = 8.314 times ln 5 divided by (1/300 - 1/320) = 64.2
    kJ/mol. Using log10 gives 27.9, leaving out R gives 7.7, and using Celsius gives 0.85.
- id: q2
  question: >-
    A medicine loses 10 % of its potency in the first year of storage, and its degradation is
    first order. A pharmacist asks when it will be at 50 % potency. What do you answer?
  options:
    - After 5.0 years, because it loses 10 % per year and needs to lose 50 %.
    - After 10 years, because the half-life of a first-order process is ten times the time to lose 10 %.
    - After 3.3 years, because each year it loses a larger share of what is left.
    - After about 6.6 years, because k = -ln(0.90) per year and the half-life is ln 2 divided by k.
  correct: 3
  explanation: >-
    First-order loss is exponential: k = -ln 0.90 = 0.105 per year and t1/2 = 0.693/0.105 = 6.6 years.
    A straight-line extrapolation (5 years) ignores that each year removes 10 % of a smaller amount.
- id: q3
  question: >-
    You compare two catalysts by their initial rates. You have concentration readings every 60 s,
    with visible noise, and you know the reaction is first order. Which approach gives the fairest
    comparison?
  options:
    - Fit ln c against time for each run and compare k times c0, using all the points.
    - Take the slope between the first two readings of each run, since that is closest to t = 0.
    - Use central differences between neighbouring points and take the largest value of each run.
    - Interpolate extra points every 5 s and take the slope between the first two of them.
  correct: 0
  explanation: >-
    A forward difference over the first interval is biased low and noisy. Fitting the known model to
    all points averages out the noise and gives the initial rate k c0 directly.
- id: q4
  question: >-
    0.500 mol of an ideal gas is compressed reversibly and isothermally at 300 K from 20.0 L to
    5.0 L. How much work is done on the gas?
  options:
    - About 0.94 kJ, from the starting pressure times the 15 L change.
    - About 0.75 kJ, from nRT times log10 of 4.
    - About 1.73 kJ, from nRT times ln(20.0/5.0).
    - About 3.74 kJ, from the final pressure times the 15 L change.
  correct: 2
  explanation: >-
    The pressure changes along the way, so the work is the integral of p dV: nRT ln(V1/V2) =
    0.500 times 8.314 times 300 times ln 4 = 1.73 kJ. Constant-pressure rectangles bracket it.
- id: q5
  question: >-
    You must estimate the heat to warm 1 mol of CO2 from 300 K to 700 K at constant pressure. You
    only know Cp at the two ends, 37 and 51 J/(mol K), and that Cp rises smoothly between them.
    Which estimate is most defensible?
  options:
    - 37 J/(mol K) times 400 K, about 14.8 kJ, because Cp at room temperature is the standard value.
    - The average Cp, 44 J/(mol K), times 400 K, about 17.6 kJ, a one-step trapezoid.
    - 51 J/(mol K) times 400 K, about 20.4 kJ, because the hotter end dominates the heat.
    - 51 minus 37, times 400 K, about 5.6 kJ, because only the change in Cp matters.
  correct: 1
  explanation: >-
    The heat is the integral of Cp dT. With only the two ends known, the trapezoid (average Cp times
    the range) is the best estimate; using either end alone systematically misses the changing area.
- id: q6
  question: >-
    You need the pH of four weak-acid solutions quickly. For which one must you solve the quadratic
    instead of using [H+] = sqrt(Ka C)?
  options:
    - Ka = 1.0e-3 at C = 0.010 M.
    - Ka = 1.8e-5 at C = 0.10 M.
    - Ka = 6.2e-10 at C = 0.010 M.
    - Ka = 4.0e-6 at C = 0.050 M.
  correct: 0
  explanation: >-
    The shortcut is safe when C/Ka is above about 400 (x/C under 5 %). Here C/Ka is 10, so about 27 %
    of the acid ionises; all the others have C/Ka in the thousands or more.
- id: q7
  question: >-
    Two energy levels differ by an energy that is 0.02 times kT. You need the fraction 1 - exp(-0.02)
    for a quick estimate and have no calculator. What do you use?
  options:
    - About 0.98, because exp(-0.02) is about 0.02.
    - About 0.0002, because the error of exp(x) is about x squared over 2.
    - About 0.2, because a 2 % energy gap gives a 20 % population change.
    - About 0.02, because exp(-x) is about 1 - x for small x.
  correct: 3
  explanation: >-
    The two-term Taylor series exp(-x) = 1 - x gives 1 - exp(-x) = x = 0.02. The exact value is
    0.0198; the first dropped term, x^2/2 = 0.0002, is the error.
- id: q8
  question: >-
    A car tyre at 293 K holds air at 220 kPa absolute. After driving, the air is at 303 K. Treat the
    tyre as rigid and the air as ideal. Roughly how much has the pressure risen?
  options:
    - About 2.2 kPa, because pressure rises by 1 % for a 10 K change.
    - About 22 kPa, because pressure is proportional to temperature in Celsius.
    - About 7.5 kPa, from the partial derivative nR/V = p/T, times 10 K.
    - About 0.75 kPa, from p/T times 1 K because only the change per kelvin counts.
  correct: 2
  explanation: >-
    At constant n and V, the partial derivative of p with respect to T is nR/V = p/T = 220/293 kPa
    per K. Times 10 K that is 7.5 kPa. Kelvin, not Celsius, sets the proportionality.
- id: q9
  question: >-
    You find a liquid's density from m = 10.00 g (plus or minus 0.01 g) and V = 10.0 mL (plus or
    minus 0.2 mL). Your budget allows one better instrument. Which do you buy?
  options:
    - A more precise volume device, as the volume term is 20 times the mass term.
    - A more precise balance, because mass appears in the numerator of the density.
    - Neither, because the two inputs contribute equally to the uncertainty.
    - A more precise balance, because a 0.01 g error is larger than a 0.2 mL error.
  correct: 0
  explanation: >-
    The error terms are (1/V) u_m = 0.001 g/mL and (m/V^2) u_V = 0.02 g/mL. The volume term
    dominates, so a better pipette or burette improves the result; a better balance does not.
- id: q10
  question: >-
    You plot dT/dt against (T - T_env) for your cooling mug. The points lie on a straight line, but
    it crosses dT/dt = 0 at T - T_env = 3 C instead of at zero. What is the most likely cause?
  options:
    - The thermometer lags behind the water, which shifts every reading by a constant 3 C.
    - The room was really about 3 C warmer than the T_env you entered.
    - The cooling constant k was 3 times too large because of evaporation.
    - Central differences shift the derivative by half a step, which moves the line sideways.
  correct: 1
  explanation: >-
    Newton's law says the rate is zero when T equals the true room temperature. A zero crossing at
    an excess of 3 C means the true T_env is 3 C above the value you used. Refit with the corrected value.
