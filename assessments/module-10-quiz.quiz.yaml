- id: q1
  question: >-
    A quality-control lab titrates a lactic acid drink (pKa 3.86) with standardised NaOH. The technician
    proposes methyl red because "it is the indicator we use for HCl". What do you tell her?
  options:
    - Methyl red is fine, because any indicator works once the NaOH has been properly standardised.
    - Use methyl orange instead, because its colour-change range is closer to the pKa of lactic acid.
    - Use phenolphthalein; the weak-acid jump is above pH 7 and methyl red changes in the buffer region.
    - Use bromothymol blue, because the equivalence point of every acid-base titration is exactly pH 7.00.
  correct: 2
  explanation: >-
    Before equivalence a weak acid titrand is a buffer, so methyl red (about pH 5) changes before all the
    acid has reacted. The equivalence point is basic, so an indicator near pH 8-10 gives a small error.
- id: q2
  question: >-
    You weigh 0.4084 g of KHP (204.22 g/mol) and it needs 20.00 mL of NaOH to a phenolphthalein end
    point. What is the NaOH concentration?
  options:
    - 0.2042 mol/L, from the mass divided by the volume in litres.
    - 0.1000 mol/L
    - 0.0100 mol/L, because the volume should be in millilitres.
    - 0.0500 mol/L, because KHP gives two protons.
  correct: 1
  explanation: >-
    0.4084/204.22 = 2.000e-3 mol of KHP, which is monoprotic, so 2.000e-3 mol NaOH in 0.02000 L =
    0.1000 mol/L. Dividing grams by litres skips the molar mass.
- id: q3
  question: >-
    An automatic titrator reports end points from the first-derivative peak. Its pH electrode reads 0.1
    unit high because the calibration buffer was old. Which reported values are affected?
  options:
    - Both the end-point volume and the pKa at half-equivalence shift by the same small percentage.
    - Neither, because the titrator recalibrates itself at every titration.
    - Only the end-point volume, because the derivative is very sensitive to offsets.
    - The pKa read at half-equivalence is 0.1 too high, but the end-point volume is unchanged.
  correct: 3
  explanation: >-
    A constant offset shifts the whole curve up without changing where it is steepest, so the derivative
    end point stays put. Any value read off the pH axis, such as the half-equivalence pKa, carries the offset.
- id: q4
  question: >-
    Iron(II) is titrated with cerium(IV) in 1 M HClO4, where the formal potentials are 0.767 V (Fe) and
    1.70 V (Ce). Which indicator should you choose?
  options:
    - Ferroin, which changes near 1.15 V, inside the jump around the 1.23 V equivalence potential.
    - Starch, because it detects the excess oxidising agent in any redox titration.
    - Diphenylamine sulfonic acid, which changes near 0.85 V, the potential just after the titration starts.
    - No indicator is possible, because cerium(IV) is yellow and hides every colour change.
  correct: 0
  explanation: >-
    E_eq = (0.767 + 1.70)/2 = 1.23 V. The jump runs from about 0.95 V (99.9 %) to 1.52 V (100.1 %), and
    ferroin's window of about 1.09-1.21 V lies inside it. Starch is specific to iodine.
- id: q5
  question: >-
    A pickling-brine lab needs chloride in samples at pH 3. A trainee runs the Mohr method directly. What
    will happen, and what is the better plan?
  options:
    - Low, since AgCl dissolves in acid; add more silver nitrate and repeat at the same pH.
    - High, since chromate turns into HCrO4- and the end point is late; use Volhard instead.
    - Correct, since the Mohr method works at any pH below 10 without change.
    - High, since Fe(OH)3 precipitates in the brine and adsorbs chloride; filter the sample first.
  correct: 1
  explanation: >-
    Mohr needs about pH 7-10. In acid less CrO4 2- is available, so more Ag+ is needed to form red Ag2CrO4.
    Volhard is designed for acidic solution, or bicarbonate can neutralise the sample.
- id: q6
  question: >-
    A 100.0 mL tap-water sample needs 18.40 mL of 0.01000 M EDTA at pH 10 and 13.20 mL at pH 12.5. What
    are the total hardness and the magnesium concentration?
  options:
    - 184 mg/L as CaCO3; magnesium 52 mg/L.
    - 74 mg/L as Ca; magnesium 132 mg/L as CaCO3.
    - 132 mg/L as CaCO3; magnesium 0 mg/L, since pH 12.5 titrates both ions.
    - 184 mg/L as CaCO3; magnesium 12.6 mg/L.
  correct: 3
  explanation: >-
    Total: 0.01000 x 18.40/100.0 = 1.840 mmol/L x 100.09 = 184 mg/L CaCO3. At pH 12.5 Mg(OH)2 precipitates,
    so 13.20 mL is calcium alone; Mg = 5.20 x 0.01000/100.0 = 0.520 mmol/L x 24.31 = 12.6 mg/L.
- id: q7
  question: >-
    In a gravimetric sulfate determination the BaSO4 is weighed straight from the oven while still warm,
    and the crucible was never heated to constant mass. Which result do you expect?
  options:
    - "Unreliable: warm, it reads light and may hold water; cool and weigh to constant mass."
    - A high result, because warm BaSO4 takes up extra sulfate and moisture from the oven air.
    - A correct result, because BaSO4 is insoluble and its mass cannot change at all.
    - A low result only, which the gravimetric factor corrects when you calculate.
  correct: 0
  explanation: >-
    Rising air makes a warm crucible read light, while incomplete drying leaves water that makes it heavy,
    so the error has no fixed sign. Constant mass after identical cooling is the only check.
- id: q8
  question: >-
    A coulometric titration generates I2 from iodide at a constant 5.00 mA to titrate ascorbic acid
    (one I2, two electrons, per molecule). The end point comes after 386.0 s. How much ascorbic acid was there?
  options:
    - 2.00e-5 mol, because one electron is transferred per molecule.
    - 1.93 mol, the charge in coulombs.
    - 1.00e-5 mol, from Q = It divided by 2F.
    - 5.00e-6 mol, because each I2 needs four electrons.
  correct: 2
  explanation: >-
    Q = 0.00500 x 386.0 = 1.930 C; 1.930/96485 = 2.00e-5 mol of electrons. Two electrons make one I2,
    which oxidises one ascorbic acid, so 1.00e-5 mol.
- id: q9
  question: >-
    A fluoride electrode gives a slope of -58 mV/decade between 0.5 and 10 mg/L. A groundwater sample,
    measured without TISAB, reads 30 % lower than by standard addition in TISAB. What is the most likely cause?
  options:
    - The slope is too low, so every reading should be multiplied by 1.3.
    - Al3+ or Fe3+ in the sample bind fluoride; the chelator in TISAB frees it.
    - Standard addition always reads 30 % high, so the first, direct result is correct.
    - Fluoride evaporates as HF from untreated samples during the measurement.
  correct: 1
  explanation: >-
    Without TISAB, fluoride bound to Al3+ or Fe3+ is invisible to the electrode and the ionic strength and
    pH differ from the standards. TISAB frees complexed fluoride and fixes pH and ionic strength.
- id: q10
  question: >-
    Two students titrate the same vinegar five times each. A: mean 4.97, SD 0.02, no blank. B: mean 4.95,
    SD 0.06, with blank. The true value is 4.95. Which statement is right?
  options:
    - A is better in every way, because a smaller SD always means a more accurate and trustworthy mean.
    - B is worse in every way, because its SD is three times larger.
    - Both are equally good, because both means are within 1 % of the true value of 4.95.
    - A is more precise but biased high; B is less precise but unbiased thanks to the blank.
  correct: 3
  explanation: >-
    Precision (small SD) and accuracy (no bias) are different. A's results share the indicator excess that
    only a blank removes; B scatters more but is centred on the true value. Report both properties.
